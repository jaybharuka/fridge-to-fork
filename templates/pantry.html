<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0F0F0F" />
  <title>Home Pantry — Fridge to Fork</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --swiggy-orange: #FC8019;
      --swiggy-orange-dark: #E16A10;
      --bg: #0F0F0F;
      --surface: #1C1C1C;
      --surface-2: #242424;
      --border: #2E2E2E;
      --text: #FFFFFF;
      --text-2: #A8A8A8;
      --text-3: #6B6B6B;
      --green: #2D6A4F;
      --green-bright: #48C479;
      --blue: #4E9FE5;
      --red: #E74C3C;
      --yellow: #E0A32C;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; min-width:0; }
    body {
      font-family:'Inter',sans-serif; font-size:14px; line-height:1.5; font-weight:400;
      background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden;
    }
    i[data-lucide] { display:inline-block; width:18px; height:18px; }
    svg.lucide { width:1em; height:1em; }
    .page { max-width:480px; margin:0 auto; min-height:100vh; }
    @media (min-width:481px) {
      .page { max-width:440px; box-shadow:0 0 60px rgba(0,0,0,.5); border-left:1px solid var(--border); border-right:1px solid var(--border); }
    }
    .app-header { position:sticky; top:0; z-index:30; height:56px; background:rgba(15,15,15,.95); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
    .app-header-inner { max-width:480px; margin:0 auto; height:100%; padding:0 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .header-left { display:flex; align-items:center; gap:10px; min-width:0; }
    .back-link { color:var(--text-2); display:flex; align-items:center; justify-content:center; text-decoration:none; }
    .header-title { display:flex; align-items:center; gap:8px; color:var(--swiggy-orange); font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .header-title i { width:18px; height:18px; }
    .scan-btn {
      display:inline-flex; align-items:center; gap:6px; border:1px solid var(--swiggy-orange); color:var(--swiggy-orange);
      background:transparent; border-radius:20px; padding:8px 14px; font-size:12px; font-weight:600; text-decoration:none;
      white-space:nowrap; flex-shrink:0;
    }
    .scan-btn:hover { background:rgba(252,128,25,.08); }
    .scan-btn i { width:14px; height:14px; }

    .wrap { padding:16px 16px 100px; }

    .cook-btn {
      width:100%; height:46px; border-radius:14px; margin-bottom:14px;
      background:transparent; border:1.5px solid var(--green-bright); color:var(--green-bright);
      display:flex; align-items:center; justify-content:center; gap:8px;
      font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; text-decoration:none;
    }
    .cook-btn:hover { background:rgba(72,196,121,.08); }
    .cook-btn i { width:16px; height:16px; }

    .tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; }
    .tab {
      flex-shrink:0; padding:8px 16px; border-radius:20px; font-size:12px; font-weight:600;
      background:var(--surface); border:1px solid var(--border); color:var(--text-2); cursor:pointer; font-family:inherit;
    }
    .tab.active { background:var(--swiggy-orange); border-color:var(--swiggy-orange); color:#fff; }

    .running-strip { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; margin-bottom:16px; }
    .running-card {
      flex-shrink:0; width:130px; background:var(--surface); border:1px solid rgba(231,76,60,.35);
      border-radius:14px; padding:10px 12px;
    }
    .running-card .rname { font-size:12px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .running-card .rdays { font-size:11px; color:var(--red); margin-top:4px; font-weight:600; }

    .section-label { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--text-2); margin:18px 0 8px; }
    .section-label i { width:14px; height:14px; color:var(--swiggy-orange); }

    .item-grid { display:flex; flex-direction:column; gap:10px; }
    .item-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; display:flex; align-items:center; gap:12px; }
    .item-card.critical { border-color:rgba(231,76,60,.4); }
    .item-card.low { border-color:rgba(224,163,44,.4); }
    .item-info { flex:1; min-width:0; }
    .item-name { font-size:14px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .item-meta { font-size:11px; color:var(--text-3); margin-top:2px; }
    .days-badge { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; margin-top:6px; }
    .days-badge.critical { background:rgba(231,76,60,.15); color:var(--red); }
    .days-badge.low { background:rgba(224,163,44,.15); color:var(--yellow); }
    .days-badge.ok { background:rgba(72,196,121,.12); color:var(--green-bright); }
    .qty-controls { display:flex; align-items:center; gap:8px; flex-shrink:0; }
    .qty-btn {
      width:30px; height:30px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2);
      color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; font-family:inherit;
    }
    .qty-btn:hover { border-color:var(--swiggy-orange); color:var(--swiggy-orange); }
    .qty-btn i { width:14px; height:14px; }
    .qty-val { min-width:44px; text-align:center; font-size:13px; font-weight:600; }
    .purchased-btn {
      flex-shrink:0; border:none; background:rgba(72,196,121,.12); color:var(--green-bright);
      border-radius:10px; padding:6px 10px; font-size:11px; font-weight:700; cursor:pointer; font-family:inherit;
    }
    .purchased-btn:hover { background:rgba(72,196,121,.2); }

    .fab {
      position:fixed; bottom:24px; right:calc(50% - 220px + 20px); z-index:40;
      width:52px; height:52px; border-radius:50%; background:var(--swiggy-orange); color:#fff; border:none;
      display:flex; align-items:center; justify-content:center; box-shadow:0 6px 20px rgba(252,128,25,.4); cursor:pointer;
    }
    @media (max-width:480px) { .fab { right:20px; } }
    .fab i { width:24px; height:24px; }

    .shopping-panel {
      background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; margin-top:20px;
    }
    .shopping-panel h3 { font-size:14px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
    .shopping-panel h3 i { width:16px; height:16px; color:var(--swiggy-orange); }
    .shopping-list-item { display:flex; justify-content:space-between; font-size:12px; color:var(--text-2); padding:6px 0; border-bottom:1px solid rgba(255,255,255,.05); }
    .shopping-list-item:last-child { border-bottom:none; }
    .platform-row { display:flex; gap:8px; margin-top:14px; }
    .platform-btn {
      flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px; border-radius:12px;
      border:1px solid var(--border); background:var(--surface-2); color:#fff; font-size:11px; font-weight:700; cursor:pointer; font-family:inherit;
    }
    .platform-btn:hover { border-color:var(--platform-color, var(--swiggy-orange)); }
    .platform-dot { width:10px; height:10px; border-radius:50%; }

    .order-launched-card {
      background:rgba(72,196,121,.08); border:1px solid rgba(72,196,121,.3); border-radius:16px; padding:16px; margin-top:14px; text-align:center;
    }
    .order-launched-card i { width:28px; height:28px; color:var(--green-bright); margin-bottom:6px; }
    .order-launched-card .title { font-weight:700; font-size:14px; color:var(--green-bright); }
    .order-launched-card .sub { font-size:12px; color:var(--text-2); margin-top:4px; }

    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
    @media (min-width:481px) { .modal-overlay { align-items:center; } }
    .modal-sheet { width:100%; max-width:480px; background:var(--surface); border-radius:20px 20px 0 0; padding:20px; max-height:85vh; overflow-y:auto; }
    @media (min-width:481px) { .modal-sheet { border-radius:20px; } }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .modal-header h3 { font-size:16px; font-weight:700; }
    .modal-close { background:none; border:none; color:var(--text-2); cursor:pointer; }
    .modal-close i { width:20px; height:20px; }
    .field { margin-bottom:12px; }
    .field label { display:block; font-size:11px; font-weight:600; color:var(--text-3); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
    .field input, .field select {
      width:100%; height:44px; padding:0 12px; background:var(--surface-2); border:1px solid var(--border);
      border-radius:10px; color:#fff; font-size:14px; font-family:inherit; outline:none;
    }
    .field input:focus, .field select:focus { border-color:var(--swiggy-orange); }
    .field-row { display:flex; gap:10px; }
    .field-row .field { flex:1; }
    .scan-inline-btn {
      display:flex; align-items:center; justify-content:center; gap:8px; width:100%; height:44px; border-radius:10px;
      border:1px dashed var(--border); background:transparent; color:var(--text-2); font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; margin-bottom:14px;
    }
    .scan-inline-btn i { width:16px; height:16px; }
    .modal-submit {
      width:100%; height:48px; border-radius:14px; background:var(--swiggy-orange); color:#fff; border:none;
      font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:6px;
    }

    .toast {
      position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
      background:var(--surface-2); border:1px solid var(--border); color:#fff;
      padding:12px 18px; border-radius:12px; font-size:13px; z-index:60; opacity:0;
      transition:.3s ease; pointer-events:none; max-width:90%; text-align:center;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .empty-state { text-align:center; padding:40px 16px; color:var(--text-3); font-size:13px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo } = React;

    const PLATFORMS = [
      { id: 'blinkit',  name: 'Blinkit',   color: '#F8CB46', url: 'https://blinkit.com/s/?q=' },
      { id: 'instamart', name: 'Instamart', color: '#48C479', url: 'https://www.swiggy.com/instamart/search?custom_back=true&query=' },
      { id: 'zepto',    name: 'Zepto',     color: '#8B3DFF', url: 'https://www.zeptonow.com/search?query=' },
    ];

    const CATEGORIES = [
      { id: 'all', label: 'All' },
      { id: 'food', label: 'Food' },
      { id: 'bathroom', label: 'Bathroom' },
      { id: 'cosmetics', label: 'Cosmetics' },
      { id: 'household', label: 'Household' },
    ];

    function daysLeft(item) {
      if (!item.dailyUse || item.dailyUse <= 0) return Infinity;
      return item.qty / item.dailyUse;
    }

    function stockUrgency(item) {
      const d = daysLeft(item);
      if (item.qty <= 0 || d <= 2) return 'critical';
      if (item.qty <= item.threshold || d <= 5) return 'low';
      return 'ok';
    }

    const urgencyColor = { critical: 'var(--red)', low: 'var(--yellow)', ok: 'var(--green-bright)' };
    const urgencyBadge = { critical: 'Critical', low: 'Running low', ok: 'Stocked' };

    function DaysBadge({ item }) {
      const urgency = stockUrgency(item);
      const d = daysLeft(item);
      const label = d === Infinity ? urgencyBadge[urgency] : `${Math.max(0, Math.round(d))}d left`;
      return (
        <span className={`days-badge ${urgency}`}>
          <i data-lucide={urgency === 'critical' ? 'alert-triangle' : urgency === 'low' ? 'clock' : 'check-circle'} style={{width:11,height:11}}></i>
          {label}
        </span>
      );
    }

    function ItemCard({ item, onAdjust, onMarkPurchased }) {
      const urgency = stockUrgency(item);
      return (
        <div className={`item-card ${urgency}`}>
          <div className="item-info">
            <div className="item-name">{item.name}</div>
            <div className="item-meta">{item.qty} {item.unit} · threshold {item.threshold} {item.unit}</div>
            <DaysBadge item={item} />
          </div>
          <div className="qty-controls">
            <button className="qty-btn" onClick={() => onAdjust(item.id, -Math.max(item.dailyUse || 0.1, 0.1))}>
              <i data-lucide="minus"></i>
            </button>
            <span className="qty-val">{Math.round(item.qty * 100) / 100}</span>
            <button className="qty-btn" onClick={() => onAdjust(item.id, Math.max(item.dailyUse || 0.1, 0.1))}>
              <i data-lucide="plus"></i>
            </button>
          </div>
          {urgency !== 'ok' && (
            <button className="purchased-btn" onClick={() => onMarkPurchased(item.id)}>Purchased</button>
          )}
        </div>
      );
    }

    function RunningOutStrip({ items }) {
      const running = items.filter(i => stockUrgency(i) !== 'ok')
        .sort((a, b) => daysLeft(a) - daysLeft(b));
      if (!running.length) return null;
      return (
        <React.Fragment>
          <div className="section-label"><i data-lucide="alert-triangle"></i> Running out soon</div>
          <div className="running-strip">
            {running.map(item => (
              <div className="running-card" key={item.id}>
                <div className="rname">{item.name}</div>
                <div className="rdays">
                  {daysLeft(item) === Infinity ? 'Low stock' : `${Math.max(0, Math.round(daysLeft(item)))}d left`}
                </div>
              </div>
            ))}
          </div>
        </React.Fragment>
      );
    }

    function OrderLaunchedCard({ platformName }) {
      return (
        <div className="order-launched-card">
          <i data-lucide="check-circle"></i>
          <div className="title">Order launched on {platformName}</div>
          <div className="sub">A new tab opened with your shopping list pre-searched.</div>
        </div>
      );
    }

    function ShoppingListPanel({ items, onMarkAllPurchased }) {
      const [launched, setLaunched] = useState(null);
      const shoppingItems = items.filter(i => stockUrgency(i) !== 'ok');
      if (!shoppingItems.length) return null;

      const openPlatform = (platform) => {
        const query = shoppingItems.map(i => i.name).join(' ');
        window.open(platform.url + encodeURIComponent(query), '_blank');
        setLaunched(platform.name);
      };

      return (
        <div className="shopping-panel">
          <h3><i data-lucide="shopping-cart"></i> Shopping list ({shoppingItems.length})</h3>
          {shoppingItems.map(i => (
            <div className="shopping-list-item" key={i.id}>
              <span>{i.name}</span>
              <span>{Math.round(i.qty * 100) / 100} {i.unit}</span>
            </div>
          ))}
          <div className="platform-row">
            {PLATFORMS.map(p => (
              <button
                key={p.id}
                className="platform-btn"
                style={{ '--platform-color': p.color }}
                onClick={() => openPlatform(p)}
              >
                <span className="platform-dot" style={{ background: p.color }}></span>
                {p.name}
              </button>
            ))}
          </div>
          <button
            className="modal-submit"
            style={{ marginTop: 12, background: 'var(--green)' }}
            onClick={() => { onMarkAllPurchased(shoppingItems.map(i => i.id)); setLaunched(null); }}
          >
            Mark all as purchased
          </button>
          {launched && <OrderLaunchedCard platformName={launched} />}
        </div>
      );
    }

    function AddItemModal({ onClose, onAdd }) {
      const [form, setForm] = useState({
        name: '', category: 'food', qty: '', threshold: '', unit: 'piece', dailyUse: '', barcode: '',
      });
      const [scanning, setScanning] = useState(false);

      const set = (k, v) => setForm(prev => ({ ...prev, [k]: v }));

      const scanBarcode = async () => {
        if (!('BarcodeDetector' in window)) {
          alert('Barcode scanning is not supported in this browser. Enter the barcode manually.');
          return;
        }
        try {
          setScanning(true);
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          const video = document.createElement('video');
          video.srcObject = stream;
          await video.play();
          const detector = new window.BarcodeDetector();
          const interval = setInterval(async () => {
            try {
              const codes = await detector.detect(video);
              if (codes.length) {
                set('barcode', codes[0].rawValue);
                clearInterval(interval);
                stream.getTracks().forEach(t => t.stop());
                setScanning(false);
              }
            } catch (e) {}
          }, 500);
          setTimeout(() => {
            clearInterval(interval);
            stream.getTracks().forEach(t => t.stop());
            setScanning(false);
          }, 15000);
        } catch (e) {
          setScanning(false);
          alert('Could not access camera for barcode scanning.');
        }
      };

      const submit = (e) => {
        e.preventDefault();
        if (!form.name.trim()) return;
        onAdd({
          id: `custom_${Date.now()}`,
          name: form.name.trim(),
          category: form.category,
          qty: parseFloat(form.qty) || 0,
          threshold: parseFloat(form.threshold) || 0,
          unit: form.unit || 'piece',
          dailyUse: parseFloat(form.dailyUse) || 0,
          barcode: form.barcode || '',
        });
        onClose();
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-sheet" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3>Add pantry item</h3>
              <button className="modal-close" onClick={onClose}><i data-lucide="x"></i></button>
            </div>
            <button className="scan-inline-btn" onClick={scanBarcode} type="button">
              <i data-lucide="scan-barcode"></i> {scanning ? 'Scanning…' : 'Scan barcode'}
            </button>
            <form onSubmit={submit}>
              <div className="field">
                <label>Item name</label>
                <input value={form.name} onChange={e => set('name', e.target.value)} placeholder="e.g. Basmati Rice" required />
              </div>
              <div className="field">
                <label>Category</label>
                <select value={form.category} onChange={e => set('category', e.target.value)}>
                  <option value="food">Food</option>
                  <option value="bathroom">Bathroom</option>
                  <option value="cosmetics">Cosmetics</option>
                  <option value="household">Household</option>
                </select>
              </div>
              <div className="field-row">
                <div className="field">
                  <label>Quantity</label>
                  <input type="number" step="0.01" value={form.qty} onChange={e => set('qty', e.target.value)} placeholder="0" />
                </div>
                <div className="field">
                  <label>Unit</label>
                  <input value={form.unit} onChange={e => set('unit', e.target.value)} placeholder="kg / g / piece" />
                </div>
              </div>
              <div className="field-row">
                <div className="field">
                  <label>Threshold</label>
                  <input type="number" step="0.01" value={form.threshold} onChange={e => set('threshold', e.target.value)} placeholder="0" />
                </div>
                <div className="field">
                  <label>Daily use</label>
                  <input type="number" step="0.001" value={form.dailyUse} onChange={e => set('dailyUse', e.target.value)} placeholder="0" />
                </div>
              </div>
              <div className="field">
                <label>Barcode (optional)</label>
                <input value={form.barcode} onChange={e => set('barcode', e.target.value)} placeholder="e.g. 8901063021010" />
              </div>
              <button className="modal-submit" type="submit">Add item</button>
            </form>
          </div>
        </div>
      );
    }

    function Toast({ message }) {
      if (!message) return null;
      return <div className={`toast ${message ? 'show' : ''}`}>{message}</div>;
    }

    function App() {
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [activeCategory, setActiveCategory] = useState('all');
      const [showAddModal, setShowAddModal] = useState(false);
      const [toast, setToast] = useState('');

      useEffect(() => {
        fetch('/api/inventory')
          .then(r => r.json())
          .then(data => {
            setItems(data.items);
            setLoading(false);
          })
          .catch(() => setLoading(false));
      }, []);

      useEffect(() => {
        try { lucide.createIcons(); } catch (e) {}
      });

      const flashToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 2500);
      };

      const handleAdjust = async (id, delta) => {
        setItems(prev => prev.map(item =>
          item.id === id
            ? { ...item, qty: Math.max(0, Math.round((item.qty + delta) * 100) / 100) }
            : item
        ));
        await fetch('/api/inventory/adjust', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ itemId: id, delta }),
        });
      };

      const handleMarkPurchased = async (id) => {
        const item = items.find(i => i.id === id);
        if (!item) return;
        const restock = item.dailyUse > 0 ? item.dailyUse * 14 : item.threshold;
        const delta = restock - item.qty;
        setItems(prev => prev.map(i =>
          i.id === id ? { ...i, qty: Math.round(restock * 100) / 100 } : i
        ));
        await fetch('/api/inventory/adjust', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ itemId: id, delta }),
        });
        flashToast(`${item.name} restocked`);
      };

      const handleMarkAllPurchased = async (ids) => {
        for (const id of ids) {
          await handleMarkPurchased(id);
        }
        flashToast('Shopping list cleared');
      };

      const handleAddItem = async (newItem) => {
        setItems(prev => [newItem, ...prev]);
        await fetch('/api/inventory/item', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newItem),
        });
        flashToast(`${newItem.name} added`);
      };

      const filteredItems = useMemo(() => {
        if (activeCategory === 'all') return items;
        return items.filter(i => i.category === activeCategory);
      }, [items, activeCategory]);

      if (loading) return (
        <div style={{display:'flex', alignItems:'center', justifyContent:'center', height:'100vh', background:'#0F0F0F', color:'#FC8019', fontFamily:'Inter, sans-serif', fontSize:16}}>
          Loading inventory...
        </div>
      );

      return (
        <div className="page">
          <header className="app-header">
            <div className="app-header-inner">
              <div className="header-left">
                <a href="/" className="back-link"><i data-lucide="arrow-left"></i></a>
                <div className="header-title"><i data-lucide="package"></i> Home Pantry</div>
              </div>
              <a href="/" className="scan-btn"><i data-lucide="camera"></i> Scan Fridge</a>
            </div>
          </header>

          <div className="wrap">
            <a
              href="/?mode=inventory"
              className="cook-btn"
              onClick={(e) => { e.preventDefault(); window.location.href = '/?mode=inventory'; }}
            >
              <i data-lucide="chef-hat"></i> What can I cook?
            </a>

            <div className="tabs">
              {CATEGORIES.map(c => (
                <button
                  key={c.id}
                  className={`tab ${activeCategory === c.id ? 'active' : ''}`}
                  onClick={() => setActiveCategory(c.id)}
                >
                  {c.label}
                </button>
              ))}
            </div>

            <RunningOutStrip items={items} />

            <div className="section-label"><i data-lucide="list"></i> All items ({filteredItems.length})</div>
            {filteredItems.length === 0 ? (
              <div className="empty-state">No items in this category yet.</div>
            ) : (
              <div className="item-grid">
                {filteredItems.map(item => (
                  <ItemCard key={item.id} item={item} onAdjust={handleAdjust} onMarkPurchased={handleMarkPurchased} />
                ))}
              </div>
            )}

            <ShoppingListPanel items={items} onMarkAllPurchased={handleMarkAllPurchased} />
          </div>

          <button className="fab" onClick={() => setShowAddModal(true)}><i data-lucide="plus"></i></button>

          {showAddModal && (
            <AddItemModal onClose={() => setShowAddModal(false)} onAdd={handleAddItem} />
          )}

          <Toast message={toast} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
