      "Omelette","French Toast","Pancakes","Waffles","Crepes",
      "Caesar Salad","Greek Salad","Pasta Salad","Coleslaw",
      "Soup","Tomato Soup","Mushroom Soup","French Onion Soup",
      "Mac and Cheese","Grilled Chicken","Steak","Fish and Chips",

      // Asian
      "Sushi","Ramen","Udon","Pad Thai","Tom Yum Soup","Green Curry",
      "Red Curry","Massaman Curry","Bibimbap","Kimchi Fried Rice",
      "Dim Sum","Baozi","Pho","Banh Mi","Laksa","Nasi Goreng",
      "Miso Soup","Tempura","Teriyaki Chicken","Kung Pao Chicken",

      // Mexican
      "Tacos","Burrito","Quesadilla","Nachos","Guacamole","Enchiladas",
      "Fajitas","Churros","Salsa",

      // Healthy / Trendy
      "Smoothie Bowl","Acai Bowl","Overnight Oats","Avocado Toast",
      "Quinoa Salad","Buddha Bowl","Grain Bowl","Protein Bowl",
    ];

    let activeSuggestionIndex = -1;

    const dishInput = document.getElementById('targetDish');
    const suggestionBox = document.createElement('div');
    suggestionBox.id = 'dishSuggestions';
    suggestionBox.style.cssText = `
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      z-index: 999;
      overflow: hidden;
      display: none;
      margin-top: 6px;
    `;
    dishInput.parentElement.style.position = 'relative';
    dishInput.parentElement.appendChild(suggestionBox);

    function escapeRegExp(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function renderSuggestions(suggestions, query) {
      if (!suggestions.length) {
        suggestionBox.style.display = 'none';
        return;
      }
      const queryRegex = new RegExp(`(${escapeRegExp(query)})`, 'gi');
      suggestionBox.innerHTML = suggestions.map((s, i) => {
        const safe = escapeHtml(s);
        const highlighted = safe.replace(queryRegex, '<span style="color:var(--orange);font-weight:700">$1</span>');
        return `<div class="suggestion-row" data-index="${i}" data-value="${safe}"
          style="padding:14px 16px;cursor:pointer;font-size:14px;
          font-family:'Plus Jakarta Sans',sans-serif;
          border-bottom:1px solid var(--border);
          transition:background 0.1s ease;"
          onmouseenter="this.style.background='var(--orange-light)'"
          onmouseleave="this.style.background='transparent'"
          onclick="selectSuggestion(this.dataset.value)">
          ${highlighted}
        </div>`;
      }).join('');
      suggestionBox.style.display = 'block';
      activeSuggestionIndex = -1;
    }

    function selectSuggestion(value) {
      dishInput.value = value;
      suggestionBox.style.display = 'none';
      activeSuggestionIndex = -1;
      dishInput.focus();
    }

    dishInput.addEventListener('input', () => {
      const q = dishInput.value.trim();
      if (q.length < 2) {
        suggestionBox.style.display = 'none';
        return;
      }

      const qLower = q.toLowerCase();
      const startsWith = [];
      const contains = [];
      for (const d of INSTANT_DISHES) {
        const dLower = d.toLowerCase();
        if (dLower.startsWith(qLower)) startsWith.push(d);
        else if (dLower.includes(qLower)) contains.push(d);
      }
      renderSuggestions([...startsWith, ...contains].slice(0, 7), q);
    });

    dishInput.addEventListener('keydown', (e) => {
      const rows = suggestionBox.querySelectorAll('.suggestion-row');
      if (!rows.length) return;
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeSuggestionIndex = Math.min(activeSuggestionIndex + 1, rows.length - 1);
        rows.forEach((r, i) => r.style.background = i === activeSuggestionIndex ? 'var(--orange-light)' : 'transparent');
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeSuggestionIndex = Math.max(activeSuggestionIndex - 1, 0);
        rows.forEach((r, i) => r.style.background = i === activeSuggestionIndex ? 'var(--orange-light)' : 'transparent');
      } else if (e.key === 'Enter' && activeSuggestionIndex >= 0) {
        e.preventDefault();
        selectSuggestion(rows[activeSuggestionIndex].dataset.value);
      } else if (e.key === 'Escape') {
        suggestionBox.style.display = 'none';
      }
    });

    document.addEventListener('click', (e) => {
      if (!dishInput.parentElement.contains(e.target)) {
        suggestionBox.style.display = 'none';
      }
    });

    function handleEvent(ev) {
      if (ev.type === 'progress') {
        setStep(ev.step, 'active', ev.message);
        if (ev.step === 2) { markProgressStepDone(2); }
        return;
      }

      if (ev.type === 'step1') {
        markProgressStepDone(1);
        setProgress(30);
        const stepCount = (ev.ingredients || []).length;
        addStatusLine(currentScanHasPhoto ? `Found ${stepCount} ingredients` : 'Getting the full ingredient list');
        if (currentScanHasPhoto) triggerFridgeDots(stepCount);
        const hasIngredients = (ev.ingredients || []).length > 0;
        const isPhotoScan = ev.source !== 'recipe';
        setStep(1, 'done', hasIngredients ? `${ev.ingredients.length} ingredients found` : 'Ready to scan');
        currentFridgeIngredients = ev.ingredients || [];
        const fridgeSection = document.getElementById('fridgeIngredientsSection');
        // Recipe mode starts with an intentionally empty fridge — nothing
        // to show. A photo scan that comes back empty is a real failure
        // to detect anything, so surface it instead of hiding silently.
        if (!hasIngredients && isPhotoScan) {
          fridgeSection.classList.remove('hidden');
          document.getElementById('fridgeDesc').textContent = '';
          document.getElementById('ingredientChips').innerHTML =
            `<div class="scan-state-card">
              <i data-lucide="refrigerator" class="scan-state-icon"></i>
              <div class="scan-state-heading">Nothing detected in your fridge</div>
              <div class="scan-state-sub">Try a clearer photo with better lighting, or continue without a photo</div>
              <button type="button" class="cta-secondary-btn" onclick="resetToLanding()">Try again</button>
            </div>`;
        } else {
          fridgeSection.classList.toggle('hidden', !hasIngredients);
          document.getElementById('fridgeDesc').textContent = ev.raw_description;
          const chips = ev.ingredients
            .filter(i => i.name && i.name.trim() !== '')
            .map((i, idx) =>
            `<div class="chip ${confClass(i.confidence)} [animation-delay:${idx * 30}ms]">
              <div class="chip-dot"></div>
              ${escapeHtml(i.name)}
              <span class="chip-pct">${i.confidence}%</span>
            </div>`
          ).join('');
          document.getElementById('ingredientChips').innerHTML = chips;
        }
        resultsEl.classList.add('show');
        try { lucide.createIcons(); } catch {}
        return;
      }

      if (ev.type === 'step2') {
        markProgressStepDone(3);
        setProgress(70);
        addStatusLine(currentScanHasPhoto ? `Checking what you need for ${currentScanDish}` : 'Checking your kitchen staples');
        setStep(2, 'done', ev.recommended_meal ? `Recommend: ${ev.recommended_meal}` : 'Done');

        const cards = ev.suggestions.map(s => {
          const isRec = s.name === ev.recommended_meal;
          return `<div class="meal-card">
            ${isRec ? '<div class="meal-header-bar"><i data-lucide="star"></i> Recommended</div>' : ''}
            <div class="meal-body">
              <div class="meal-name">${escapeHtml(s.name)}</div>
              <div class="meal-desc">${escapeHtml(s.description)}</div>
              <div class="meal-tags-row">
                <span class="meal-tag"><i data-lucide="clock"></i> ${s.prep_time_minutes}m</span>
                ${s.cuisine ? `<span class="meal-tag"><i data-lucide="globe"></i> ${escapeHtml(s.cuisine)}</span>` : ''}
              </div>
            </div>
          </div>`;
        }).join('');
        document.getElementById('mealCards').innerHTML = cards;
        document.getElementById('mealSuggestionsSection').classList.toggle('hidden', ev.suggestions.length <= 1);
        renderRecipeChecklist(ev);
        try { lucide.createIcons(); } catch {}

        if (ev.recommended_meal) {
          fetch(`/api/youtube?dish=${encodeURIComponent(ev.recommended_meal)}`)
            .then(r => r.json())
            .then(data => renderYouTubeEmbed(data))
            .catch(() => renderYouTubeEmbed(null));
        }
        return;
      }

      if (ev.type === 'awaiting_user_choice') {
        markProgressStepDone(4);
        setProgress(90);
        addStatusLine('Figuring out what to order');
        currentMealName = ev.recommended_meal || '';
        currentMissingIngredients = ev.missing_ingredients || [];
        setStep(3, '', 'Waiting for your choice');
        renderChoiceCard(ev);
        resultsEl.classList.add('show');
        return;
      }

      if (ev.type === 'complete') {
        markProgressStepDone(5);
        setProgress(100);
        addStatusLine('Done');
        hideScanning();
        setTimeout(() => {
          hideLoadingOverlay();
          revealResultsSection();
        }, 500);
        return;
      }

      if (ev.type === 'top_up') {
        const suggestions = ev.suggestions || [];
        if (!suggestions.length) return;
        currentTopUpSuggestions = suggestions;

        const cards = suggestions.map((s, i) => `
            <div class="topup-product-card [animation-delay:${i * 80}ms]">
              <div class="topup-img-placeholder" id="topupImg-${i}"></div>
              <div class="topup-body">
                <div class="topup-name">${escapeHtml(s.name)}</div>
                <div class="topup-bottom-row">
                  <span class="topup-price">₹${s.estimated_price || 0}</span>
                  <button class="topup-add-btn" id="topupAddBtn-${i}" onclick="addTopUpToCart(${i})">
                    <i data-lucide="plus"></i> Add
                  </button>
                </div>
              </div>
            </div>`
        ).join('');

        document.getElementById('topUpSection').innerHTML =
          `<button type="button" class="section-label topup-header-row topup-toggle" onclick="toggleTopUpSection()">
            <i data-lucide="sparkles"></i> Top up your meal <span class="spacer"></span><span class="topup-powered">instamart</span>
            <i data-lucide="chevron-down" class="ml-2 ${topUpSectionExpanded ? 'rotated' : ''}" id="topupCaret"></i>
          </button>
          <div class="topup-content ${topUpSectionExpanded ? '' : 'collapsed'}" id="topupContent">
            <p class="topup-subtitle">Small additions, big upgrade</p>
            <div class="topup-scroll">${cards}</div>
          </div>`;
        try { lucide.createIcons(); } catch {}

        // Placeholder shows first (grey square, via .topup-img-placeholder's
        // own background) — each card's real image resolves independently
        // and asynchronously, falling back to a letter avatar if it 404s.
        suggestions.forEach((s, i) => {
          getTopUpImageUrl(s.name).then(url => {
            const container = document.getElementById(`topupImg-${i}`);
            if (!container) return;
            const img = document.createElement('img');
            img.src = url;
            img.alt = '';
            img.style.width = '80px';
            img.style.height = '80px';
            img.style.objectFit = 'contain';
            const emojiDiv = document.createElement('div');
            emojiDiv.style.cssText = `
              display:none;
              width:100%;
              height:100%;
              align-items:center;
              justify-content:center;
              font-size:48px;
              line-height:1;
            `;
            img.onerror = function() {
              this.style.display = 'none';
              emojiDiv.style.display = 'flex';
              emojiDiv.textContent = getEmojiForIngredient(s.name);
            };
            container.appendChild(img);
            container.appendChild(emojiDiv);
          });
        });
        return;
      }

      if (ev.type === 'cook_confirmed') {
        setStep(3, 'done', 'Ready to cook!');
        document.getElementById('orderCard').innerHTML =
          `<div class="cook-card">
            <i data-lucide="chef-hat"></i>
            <div class="title">You're all set!</div>
            <div class="sub">All ingredients are ready in your kitchen.</div>
          </div>`;
        try { lucide.createIcons(); } catch {}
        return;
      }

      if (ev.type === 'step3') {
        const label = ev.decision === 'cook' ? 'No order needed' : `Order placed via ${ev.platform}`;
        setStep(3, 'done', label);

        if (ev.placed) {
          document.getElementById('orderCard').innerHTML =
            `<div class="order-card">
              <div class="order-icon-wrap"><i data-lucide="circle-check-big"></i></div>
              <div class="order-title">Order confirmed!</div>
              <div class="order-id">${escapeHtml(ev.order_id)}</div>
              <div class="order-details">
                <div class="order-row"><span class="order-label">Platform</span><span class="order-value">${escapeHtml(ev.platform)}</span></div>
                <div class="order-row"><span class="order-label">Items</span><span class="order-value">${(ev.items || []).map(escapeHtml).join(', ')}</span></div>
                <div class="order-row"><span class="order-label">ETA</span><span class="order-value eta">~${escapeHtml(ev.eta_minutes)} min</span></div>
              </div>
            </div>`;
        } else if (ev.decision === 'cook') {
          document.getElementById('orderCard').innerHTML =
            `<div class="cook-card">
              <i data-lucide="chef-hat"></i>
              <div class="title">Time to cook!</div>
              <div class="sub">All ingredients are in your fridge.</div>
            </div>`;
        }
        try { lucide.createIcons(); } catch {}
        return;
      }

      if (ev.type === 'error') {
        [1,2,3].forEach(i => { const el = document.getElementById('s'+i); if(el && el.classList.contains('active')) setStep(i,'','Error'); });
        // Distinguishes the initial scan failing outright (results never
        // shown yet — full scan-failed state takes over #orderCard, the
        // only content slot in an otherwise-empty results area) from a
        // later action (e.g. placing the order) failing after results are
        // already visible, which keeps the small inline error-card instead.
        const resultsAlreadyShown = document.getElementById('resultsSection').classList.contains('fade-in');
        document.getElementById('orderCard').innerHTML = resultsAlreadyShown
          ? `<div class="error-card"><i data-lucide="circle-alert"></i><span>${escapeHtml(ev.message)}</span></div>`
          : `<div class="card scan-state-card">
              <i data-lucide="circle-alert" class="scan-state-icon"></i>
              <div class="scan-state-heading">Something went wrong</div>
              <div class="scan-state-sub">The scan didn't complete. Please try again.</div>
              <button type="button" class="cta-secondary-btn" onclick="resetToLanding()">Try again</button>
            </div>`;
        resultsEl.classList.add('show');
        hideLoadingOverlay();
        revealResultsSection();
        resetChoiceButtons();
        try { lucide.createIcons(); } catch {}
      }

      if (ev.type === 'auth_required') {
        setStep(3, '', 'Login required');
        document.getElementById('orderCard').innerHTML =
          `<div class="auth-card">
            <div class="auth-card-icon"><i data-lucide="bike"></i></div>
            <div class="auth-card-title">Connect your Swiggy account</div>
            <div class="auth-card-sub">${escapeHtml(ev.message || 'Login to place this order instantly')}</div>
            <a class="auth-cta" href="/auth/login"><i data-lucide="link-2"></i> Connect with Swiggy</a>
          </div>`;
        resultsEl.classList.add('show');
        hideLoadingOverlay();
        revealResultsSection();
        try { lucide.createIcons(); } catch {}
        resetChoiceButtons();
      }
    }

    /* ═══════════════ SMART CART ═══════════════ */
    async function openSmartCart(customItems) {
      if (!customItems || !customItems.length) return;

      // Check auth status
      const authRes = await fetch('/auth/status');
      const authData = await authRes.json();

      showCartModal(customItems, authData.authenticated);
    }

    function showCartModal(items, isAuthenticated) {
      window._cartItems = items;
      window._cartAuthenticated = isAuthenticated;

      const modal = document.getElementById('smartCartModal');
      modal.style.display = 'flex';
      renderCartModalContent(items, isAuthenticated);
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function renderCartModalContent(items, isAuthenticated) {
      const body = document.getElementById('cartModalBody');

      if (!isAuthenticated) {
        // State A — show preview + connect button
        body.innerHTML = `
            <div class="cart-header">
                <div class="cart-title">Your Instamart Cart</div>
                <div class="cart-subtitle">
                    Connect Swiggy to add these items automatically
                </div>
            </div>
            <div class="cart-items-list">
                ${items.map(item => `
                    <div class="cart-item-row">
                        <div class="cart-item-icon ${item.category}">
                            ${getCategoryEmoji(item.category)}
                        </div>
                        <div class="cart-item-info">
                            <div class="cart-item-name">
                                ${escapeHtml(item.name)}
                            </div>
                            <div class="cart-item-qty">
                                Need: ${item.qty_needed.toFixed(1)}
                                ${escapeHtml(item.unit)}
                            </div>
                        </div>
                        <div class="cart-item-price">~₹--</div>
                    </div>
                `).join('')}
            </div>
            <div class="cart-summary">
                <div class="cart-summary-row">
                    <span>${items.length} items ready to add</span>
                    <span>Est. 15-30 min</span>
                </div>
            </div>
            <button class="cart-connect-btn"
                    onclick="window.location.href='/auth/login'">
                <i data-lucide="link-2"></i>
                Connect Swiggy to order
            </button>
            <div class="cart-connect-hint">
                After connecting, we'll add all items to your
                Instamart cart automatically
            </div>
            <a class="cart-manual-link"
               onclick="openInstamartManually()">
                Open Instamart manually →
            </a>
        `;
        if (typeof lucide !== 'undefined') lucide.createIcons();
      } else {
        // State B — start cart fill agent
        body.innerHTML = `
            <div class="cart-header">
                <div class="cart-title">Adding to Instamart Cart</div>
                <div class="cart-subtitle">
                    Please wait while we add your items...
                </div>
            </div>
            <div class="cart-items-list" id="cartItemsProgress">
                ${items.map(item => `
                    <div class="cart-item-row"
                         id="cart-item-${escapeHtml(item.id)}">
                        <div class="cart-item-icon ${item.category}">
                            ${getCategoryEmoji(item.category)}
                        </div>
                        <div class="cart-item-info">
                            <div class="cart-item-name">
                                ${escapeHtml(item.name)}
                            </div>
                            <div class="cart-item-status searching">
                                Waiting...
                            </div>
                        </div>
                        <div class="cart-item-status-icon">
                            <i data-lucide="clock" class="text-[var(--swiggy-text-3)] text-[16px]"></i>
                        </div>
                    </div>
                `).join('')}
            </div>
            <div id="cartProgressFooter" class="cart-progress-footer">
                Processing...
            </div>
        `;
        if (typeof lucide !== 'undefined') lucide.createIcons();
        startCartFill(items);
      }
    }

    async function startCartFill(items) {
      const response = await fetch('/api/cart-fill', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({items})
      });

      const reader = response.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const {done, value} = await reader.read();
        if (done) break;

        const text = decoder.decode(value);
        const lines = text.split('\n');

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const event = JSON.parse(line.slice(6));
            handleCartEvent(event, items);
          } catch(e) {}
        }
      }
    }

    function handleCartEvent(event, items) {
      const row = document.getElementById(
        `cart-item-${event.itemId}`
      );

      if (event.type === 'item_searching' && row) {
        row.querySelector('.cart-item-status').textContent =
          'Searching...';
        row.querySelector('.cart-item-status').className =
          'cart-item-status searching';
      }

      if (event.type === 'item_added' && row) {
        row.querySelector('.cart-item-status').textContent =
          'Added to cart';
        row.querySelector('.cart-item-status').className =
          'cart-item-status added';
        row.querySelector('.cart-item-status-icon').innerHTML =
          '<i data-lucide="circle-check" class="text-[var(--swiggy-green)] text-[16px]"></i>';
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }

      if (event.type === 'item_failed' && row) {
        row.querySelector('.cart-item-status').textContent =
          'Not found';
        row.querySelector('.cart-item-status').className =
          'cart-item-status failed';
        row.querySelector('.cart-item-status-icon').innerHTML =
          '<i data-lucide="circle-x" class="text-[var(--swiggy-red)] text-[16px]"></i>';
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }

      if (event.type === 'auth_required') {
        renderCartModalContent(items, false);
        return;
      }

      if (event.type === 'cart_complete') {
        const added = document.querySelectorAll(
          '.cart-item-status.added'
        ).length;
        const footer = document.getElementById('cartProgressFooter');
        if (footer) {
          footer.innerHTML = `
                <div class="cart-complete">
                    <i data-lucide="circle-check" class="text-[var(--swiggy-green)] text-[20px]"></i>
                    <span>Cart ready — ${added} items added</span>
                </div>
                <button class="cart-checkout-btn"
                    onclick="window.open(
                        INSTAMART_URL,'_blank'
                    )">
                    Open Instamart to checkout →
                </button>
            `;
          if (typeof lucide !== 'undefined') lucide.createIcons();
        }
      }
    }

    async function openInstamartManually() {
      const items = window._cartItems || [];
      const listText = items.map((item, i) =>
        `${i+1}. ${item.name}`
      ).join('\n');
      try {
        await navigator.clipboard.writeText(listText);
      } catch(e) {}
      const firstName = items[0]?.name || '';
      window.open(
        `${INSTAMART_URL}/search?query=` +
        encodeURIComponent(firstName),
        '_blank'
      );
      closeCartModal();
    }

    function closeCartModal() {
      document.getElementById('smartCartModal').style.display = 'none';
    }

    function getCategoryEmoji(category) {
      const map = {
        food: '🥗', bathroom: '🚿',
        cosmetics: '✨', household: '🏠'
      };
      return map[category] || '📦';
    }

    // Initial render
    setAnalyseReady('Get Recipe');
    [1,2,3].forEach(i => setStep(i, '', 'Waiting'));
    try { lucide.createIcons(); } catch {}
  </script>
