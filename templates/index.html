<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0F0F0F" />
  <title>Fridge to Fork</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --swiggy-orange: #FC8019;
      --swiggy-orange-dark: #E16A10;
      --swiggy-orange-light: #FFF3EB;
      --swiggy-bg: #0F0F0F;
      --swiggy-surface: #1C1C1C;
      --swiggy-surface-2: #242424;
      --swiggy-border: #2E2E2E;
      --swiggy-text: #FFFFFF;
      --swiggy-text-2: #A8A8A8;
      --swiggy-text-3: #6B6B6B;
      --swiggy-green: #48C479;
      --swiggy-blue: #4E9FE5;
      --swiggy-red: #E74C3C;
    } 
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; min-width:0; }
    body {
      font-family:'Inter',sans-serif; font-size:14px; line-height:1.5; font-weight:400;
      background:var(--swiggy-bg); color:var(--swiggy-text); min-height:100vh; overflow-x:hidden;
    }
    i[data-lucide] { display:inline-block; width:18px; height:18px; }
    svg.lucide { width:1em; height:1em; }

    /* Layout */
    .page { max-width:480px; margin:0 auto; min-height:100vh; }
    .wrap { padding:16px 16px 80px; }

    @media (min-width:481px) {
      .page { max-width:440px; box-shadow:0 0 60px rgba(0,0,0,.5); border-left:1px solid var(--swiggy-border); border-right:1px solid var(--swiggy-border); }
      .desktop-hint { display:inline-block !important; }
    }

    /* Header */
    .app-header { position:sticky; top:0; z-index:30; height:56px; background:rgba(15,15,15,.85); backdrop-filter:blur(12px); border-bottom:1px solid var(--swiggy-border); }
    .app-header-inner { max-width:480px; margin:0 auto; height:100%; padding:0 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .brand { display:flex; align-items:center; gap:8px; color:var(--swiggy-orange); font-weight:700; font-size:16px; white-space:nowrap; }
    .brand i { color:var(--swiggy-orange); width:20px; height:20px; }
    .desktop-hint { display:none; font-size:11px; color:var(--swiggy-text-3); font-weight:500; }

    .auth-pill { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600; white-space:nowrap; transition:.15s ease; }
    .auth-pill:not(.connected) { border:1px solid var(--swiggy-orange); color:var(--swiggy-orange); background:transparent; }
    .auth-pill.connected { background:var(--swiggy-green); color:#fff; border:1px solid var(--swiggy-green); }
    .auth-pill a { color:inherit; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
    .auth-pill i { width:13px; height:13px; }
    .auth-pill .logout-link { margin-left:6px; text-decoration:underline; opacity:.85; font-weight:500; }

    /* Input */
    .input-section { padding:16px 0 12px; }
    .input-label { display:block; font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--swiggy-text-2); margin-bottom:8px; }
    .dish-input {
      width:100%; height:46px; padding:0 16px; font-size:16px; font-family:inherit; font-weight:400;
      background:var(--swiggy-surface); border:1px solid var(--swiggy-border); border-radius:12px;
      color:var(--swiggy-text); outline:none; transition:.15s ease;
    }
    .dish-input:focus { border-color:var(--swiggy-orange); box-shadow:0 0 0 3px rgba(252,128,25,.15); }
    .dish-input::placeholder { color:var(--swiggy-text-3); }

    /* Fridge capture */
    .upload-zone {
      position:relative; width:100%; aspect-ratio:16/9; border-radius:16px;
      border:2px dashed var(--swiggy-border); background:var(--swiggy-surface);
      display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.2s ease; overflow:hidden;
    }
    .upload-zone:hover, .upload-zone.drag { border-color:var(--swiggy-orange); background:rgba(252,128,25,.05); }
    .upload-zone input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
    .upload-empty { text-align:center; color:var(--swiggy-text-2); pointer-events:none; }
    .upload-empty i { color:var(--swiggy-orange); width:36px; height:36px; }
    .upload-empty p { font-size:13px; margin-top:10px; }

    .preview { display:none; position:relative; width:100%; aspect-ratio:16/9; border-radius:16px; overflow:hidden; }
    .preview.show { display:block; }
    .preview img { width:100%; height:100%; object-fit:cover; display:block; }
    .preview-grad { position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.75) 0%, transparent 50%); }
    .preview-row { position:absolute; bottom:12px; left:12px; right:12px; display:flex; gap:8px; }
    .ghost-btn {
      flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
      background:rgba(0,0,0,.55); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.2);
      color:#fff; font-size:13px; font-weight:600; padding:10px 14px; border-radius:10px; cursor:pointer; font-family:inherit;
    }
    .ghost-btn i { width:15px; height:15px; }

    /* Analyse button */
    .analyse-btn {
      width:100%; height:52px; border-radius:14px; margin-top:14px;
      background:var(--swiggy-orange); color:#fff; border:none; cursor:pointer;
      display:flex; align-items:center; justify-content:center; gap:8px;
      font-size:16px; font-weight:700; font-family:inherit; transition:.15s ease;
    }
    .analyse-btn:hover:not(:disabled) { background:var(--swiggy-orange-dark); }
    .analyse-btn:active:not(:disabled) { transform:scale(.98); }
    .analyse-btn:disabled { opacity:.6; cursor:not-allowed; }

    /* Pipeline steps */
    .steps { display:none; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; }
    .steps.show { display:grid; }
    .step {
      position:relative; background:var(--swiggy-surface); border-radius:10px; padding:8px 6px;
      display:flex; flex-direction:column; align-items:center; gap:4px; justify-content:center;
      min-height:64px; text-align:center; overflow:hidden;
    }
    .step:not(:first-child)::before { content:''; position:absolute; top:20px; left:-8px; width:8px; height:2px; background:var(--swiggy-border); }
    .step.done + .step::before, .step.active + .step::before { background:var(--swiggy-orange); }
    .step-num-wrap {
      width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
      background:var(--swiggy-surface-2); color:var(--swiggy-text-3); transition:.2s ease;
    }
    .step-num-wrap i { width:14px; height:14px; }
    .step.active .step-num-wrap { background:var(--swiggy-orange); color:#fff; animation:pulseOrange 1.4s ease-in-out infinite; }
    .step.done .step-num-wrap { background:transparent; color:var(--swiggy-green); }
    .step.done .step-num-wrap i { animation:popIn .3s ease; width:20px; height:20px; }
    @keyframes pulseOrange { 0%,100%{box-shadow:0 0 0 0 rgba(252,128,25,.5)} 50%{box-shadow:0 0 0 6px rgba(252,128,25,0)} }
    @keyframes popIn { 0%{transform:scale(0)} 60%{transform:scale(1.2)} 100%{transform:scale(1)} }
    .step-label-sm { font-size:10px; font-weight:600; color:var(--swiggy-text-2); text-transform:uppercase; letter-spacing:.03em; }
    .step-sub-sm { font-size:9px; color:var(--swiggy-text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

    /* Section labels */
    .section-label { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--swiggy-text-2); margin:20px 0 8px; }
    .section-label i { width:14px; height:14px; color:var(--swiggy-orange); flex-shrink:0; }
    .section-label .spacer { flex:1; }

    /* Cards */
    .card { background:var(--swiggy-surface); border:1px solid var(--swiggy-border); border-radius:16px; padding:16px; overflow-wrap:break-word; word-break:normal; opacity:0; animation:fadeInUp .35s ease forwards; }

    /* Ingredients */
    .desc { font-size:13px; color:var(--swiggy-text-2); font-style:italic; line-height:1.6; margin-bottom:12px; overflow-wrap:break-word; word-break:normal; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border-radius:20px; font-size:12px; font-weight:600; opacity:0; animation:fadeInUp .3s ease forwards; }
    .chip-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .chip.high { background:rgba(72,196,121,.12); border:1px solid rgba(72,196,121,.3); color:var(--swiggy-text); }
    .chip.high .chip-dot { background:var(--swiggy-green); }
    .chip.mid { background:rgba(252,128,25,.1); border:1px solid rgba(252,128,25,.25); color:var(--swiggy-text); }
    .chip.mid .chip-dot { background:var(--swiggy-orange); }
    .chip.low { background:rgba(255,255,255,.04); border:1px solid var(--swiggy-border); color:var(--swiggy-text-2); }
    .chip.low .chip-dot { background:var(--swiggy-text-3); }
    .chip-pct { color:var(--swiggy-text-3); font-size:11px; }

    /* Meal cards */
    #mealCards { display:flex; flex-direction:column; gap:10px; }
    .meal-card { background:var(--swiggy-surface); border:1px solid var(--swiggy-border); border-radius:16px; overflow:hidden; opacity:0; animation:fadeInUp .35s ease forwards; }
    .meal-header-bar { background:var(--swiggy-orange); color:#fff; height:36px; display:flex; align-items:center; gap:6px; padding:0 14px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
    .meal-header-bar i { width:14px; height:14px; }
    .meal-body { padding:14px; }
    .meal-name { font-size:17px; font-weight:700; color:var(--swiggy-text); overflow-wrap:break-word; word-break:normal; }
    .meal-desc {
      font-size:12px; color:var(--swiggy-text-2); margin:4px 0; line-height:1.5;
      display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
      overflow-wrap:break-word; word-break:normal; white-space:normal;
    }
    .missing-bar {
      display:flex; align-items:flex-start; gap:6px; background:rgba(252,128,25,.1); border:1px solid rgba(252,128,25,.25);
      border-radius:8px; padding:8px 10px; font-size:12px; color:var(--swiggy-orange); margin:8px 0;
      white-space:normal; word-wrap:break-word; overflow:hidden; overflow-wrap:break-word;
    }
    .missing-bar i { width:14px; height:14px; flex-shrink:0; margin-top:1px; }
    .meal-tags-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
    .meal-tag { display:inline-flex; align-items:center; gap:4px; background:var(--swiggy-surface-2); color:var(--swiggy-text-3); font-size:10px; border-radius:20px; padding:4px 10px; }
    .meal-tag i { width:11px; height:11px; }
    .meal-tag.ready { color:var(--swiggy-green); }
    .meal-tag.ready i { color:var(--swiggy-green); }

    /* Choice card */
    .choice-header-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .choice-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--swiggy-text-3); }
    .ai-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(252,128,25,.1); border:1px solid rgba(252,128,25,.3); color:var(--swiggy-orange); border-radius:20px; padding:5px 12px; font-size:11px; font-weight:600; }
    .ai-badge i { width:12px; height:12px; }
    .choice-subtitle { font-size:12px; color:var(--swiggy-text-2); font-style:italic; line-height:1.5; margin:10px 0 12px; overflow-wrap:break-word; word-break:normal; }
    .choice-buttons { display:flex; flex-direction:column; gap:8px; }
    .choice-btn {
      display:flex; align-items:center; gap:12px; width:100%; text-align:left;
      background:var(--swiggy-surface-2); border:none; border-left:3px solid transparent; border-radius:14px; padding:14px;
      cursor:pointer; font-family:inherit; color:var(--swiggy-text); transition:all .15s ease; overflow:visible;
    }
    .choice-btn:hover:not(:disabled) { filter:brightness(1.15); transform:translateX(2px); }
    .choice-btn:disabled:not(.loading) { opacity:.4; cursor:not-allowed; }
    .choice-btn.loading { opacity:.7; cursor:not-allowed; }
    .choice-btn.cook { border-left-color:var(--swiggy-green); }
    .choice-btn.order_groceries { border-left-color:var(--swiggy-blue); }
    .choice-btn.order_dish { border-left-color:var(--swiggy-orange); }
    .choice-icon-circle { width:40px; height:40px; min-width:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .choice-btn.cook .choice-icon-circle { background:rgba(72,196,121,.15); color:var(--swiggy-green); }
    .choice-btn.order_groceries .choice-icon-circle { background:rgba(78,159,229,.15); color:var(--swiggy-blue); }
    .choice-btn.order_dish .choice-icon-circle { background:rgba(252,128,25,.15); color:var(--swiggy-orange); }
    .choice-text { flex:1; min-width:0; }
    .choice-btn-title { font-size:14px; font-weight:600; color:#fff; overflow-wrap:break-word; word-break:normal; }
    .choice-btn-sub { font-size:12px; color:var(--swiggy-text-2); margin-top:2px; white-space:normal; word-wrap:break-word; overflow-wrap:break-word; word-break:normal; }
    .best-choice-badge { flex-shrink:0; white-space:nowrap; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:4px 8px; border-radius:20px; }
    .choice-btn.cook .best-choice-badge { background:rgba(72,196,121,.2); color:var(--swiggy-green); }
    .choice-btn.order_groceries .best-choice-badge { background:rgba(78,159,229,.2); color:var(--swiggy-blue); }
    .choice-btn.order_dish .best-choice-badge { background:rgba(252,128,25,.2); color:var(--swiggy-orange); }

    /* Top up */
    .topup-header-row { margin:20px 0 4px; }
    .topup-header-row .spacer { flex:1; }
    .topup-powered { font-size:10px; color:var(--swiggy-text-3); text-transform:none; letter-spacing:0; font-weight:500; }
    .topup-subtitle { font-size:12px; color:var(--swiggy-text-2); margin-bottom:10px; }
    .topup-card { background:var(--swiggy-surface); border:1px solid var(--swiggy-border); border-radius:14px; overflow:hidden; opacity:0; animation:fadeInUp .4s ease forwards; }
    .topup-row { display:flex; align-items:center; gap:12px; padding:12px 16px; opacity:0; animation:fadeInUp .4s ease forwards; }
    .topup-row:not(:last-child) { border-bottom:1px solid var(--swiggy-border); }
    .topup-icon { width:40px; height:40px; min-width:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .topup-icon.instamart { background:rgba(72,196,121,.15); color:var(--swiggy-green); }
    .topup-icon.swiggy_food { background:rgba(252,128,25,.15); color:var(--swiggy-orange); }
    .topup-info { flex:1; min-width:0; }
    .topup-name { font-size:13px; font-weight:600; color:#fff; overflow-wrap:break-word; word-break:normal; }
    .topup-reason { font-size:11px; color:var(--swiggy-text-2); margin-top:2px; overflow-wrap:break-word; word-break:normal; }
    .topup-right { flex-shrink:0; display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
    .topup-price { font-size:14px; font-weight:700; color:#fff; white-space:nowrap; }
    .topup-source { font-size:10px; white-space:nowrap; }
    .topup-source.instamart { color:var(--swiggy-green); }
    .topup-source.swiggy_food { color:var(--swiggy-orange); }
    .topup-add { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:20px; font-size:10px; font-weight:600; background:transparent; cursor:pointer; font-family:inherit; white-space:nowrap; }
    .topup-add i { width:11px; height:11px; }
    .topup-add.instamart { border:1px solid var(--swiggy-green); color:var(--swiggy-green); }
    .topup-add.swiggy_food { border:1px solid var(--swiggy-orange); color:var(--swiggy-orange); }

    /* Auth required card */
    .auth-card { background:rgba(252,128,25,.06); border:1px solid rgba(252,128,25,.2); border-radius:16px; padding:20px; text-align:center; }
    .auth-card-icon { width:56px; height:56px; border-radius:50%; background:rgba(252,128,25,.15); color:var(--swiggy-orange); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
    .auth-card-icon i { width:26px; height:26px; }
    .auth-card-title { font-weight:700; font-size:15px; color:#fff; }
    .auth-card-sub { font-size:12px; color:var(--swiggy-text-2); margin-top:6px; margin-bottom:16px; overflow-wrap:break-word; word-break:normal; }
    .auth-cta { width:100%; height:48px; border-radius:14px; background:var(--swiggy-orange); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; font-size:14px; border:none; cursor:pointer; transition:.15s ease; }
    .auth-cta:hover { background:var(--swiggy-orange-dark); }
    .auth-cta i { width:16px; height:16px; }

    /* Order confirmed card */
    .order-card { background:rgba(72,196,121,.06); border:1px solid rgba(72,196,121,.3); border-radius:16px; padding:20px; }
    .order-icon-wrap { text-align:center; margin-bottom:8px; }
    .order-icon-wrap i { width:40px; height:40px; color:var(--swiggy-green); }
    .order-title { text-align:center; color:var(--swiggy-green); font-size:18px; font-weight:700; }
    .order-id { text-align:center; font-family:'Courier New',monospace; color:var(--swiggy-text-2); font-size:12px; margin-top:4px; overflow-wrap:break-word; word-break:break-all; }
    .order-details { margin-top:14px; }
    .order-row { display:flex; justify-content:space-between; gap:8px; font-size:13px; padding:6px 0; border-top:1px solid rgba(255,255,255,.06); flex-wrap:wrap; }
    .order-row:first-child { border-top:none; }
    .order-label { color:var(--swiggy-text-3); flex-shrink:0; }
    .order-value { color:#fff; text-align:right; min-width:0; overflow-wrap:break-word; word-break:normal; }
    .order-value.eta { color:var(--swiggy-orange); font-weight:700; }

    /* Cook confirmed card */
    .cook-card { background:rgba(72,196,121,.06); border:1px solid rgba(72,196,121,.3); border-radius:16px; padding:20px; text-align:center; }
    .cook-card i { width:40px; height:40px; color:var(--swiggy-green); margin-bottom:8px; }
    .cook-card .title { color:var(--swiggy-green); font-weight:700; font-size:16px; }
    .cook-card .sub { color:var(--swiggy-text-2); font-size:12px; margin-top:4px; }

    /* Error card */
    .error-card { background:rgba(231,76,60,.1); border:1px solid rgba(231,76,60,.3); border-radius:16px; padding:16px; font-size:13px; color:var(--swiggy-red); overflow-wrap:break-word; word-break:normal; display:flex; align-items:flex-start; gap:8px; }
    .error-card i { width:16px; height:16px; flex-shrink:0; margin-top:1px; }

    /* Results */
    .results { display:none; }
    .results.show { display:block; }

    /* Spinner */
    .spin { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; flex-shrink:0; }
    @keyframes spin { to{transform:rotate(360deg)} }
    @keyframes fadeInUp { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

    /* Toast */
    .toast {
      position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
      background:var(--swiggy-surface-2); border:1px solid var(--swiggy-border); color:#fff;
      padding:12px 18px; border-radius:12px; font-size:13px; z-index:50; opacity:0;
      transition:.3s ease; pointer-events:none; max-width:90%; text-align:center;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="app-header">
      <div class="app-header-inner">
        <div class="brand"><i data-lucide="utensils"></i><span>Fridge to Fork</span></div>
        <span class="desktop-hint">Best on mobile</span>
        <div class="auth-pill" id="authPill"></div>
      </div>
    </header>

    <div class="wrap">
      <!-- Target Dish Input -->
      <div class="input-section">
        <label class="input-label" for="targetDish">What do you want to eat?</label>
        <input type="text" id="targetDish" class="dish-input" placeholder="e.g. Biryani, Pasta, Dal Makhani..." />
      </div>

      <!-- Upload -->
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept="image/*" capture="environment" />
        <div class="upload-empty">
          <i data-lucide="camera"></i>
          <p>Tap to photograph your fridge</p>
        </div>
      </div>

      <!-- Preview -->
      <div class="preview" id="preview">
        <img id="previewImg" src="" alt="Fridge preview" />
        <div class="preview-grad"></div>
        <div class="preview-row">
          <button class="ghost-btn" onclick="resetUI()"><i data-lucide="camera"></i> Retake</button>
          <button class="ghost-btn" onclick="document.getElementById('fileInput').click()"><i data-lucide="image"></i> Gallery</button>
        </div>
      </div>

      <!-- Analyse button -->
      <button class="analyse-btn" id="analyseBtn" onclick="analyse()" style="display:none">
        <span id="btnIcon"><i data-lucide="sparkles"></i></span>
        <span id="btnText">Analyse Fridge</span>
      </button>

      <!-- Progress steps -->
      <div class="steps" id="steps">
        <div class="step" id="s1">
          <div class="step-num-wrap" id="n1"></div>
          <div class="step-label-sm">Vision</div>
          <div class="step-sub-sm" id="sub1">Waiting</div>
        </div>
        <div class="step" id="s2">
          <div class="step-num-wrap" id="n2"></div>
          <div class="step-label-sm">Planner</div>
          <div class="step-sub-sm" id="sub2">Waiting</div>
        </div>
        <div class="step" id="s3">
          <div class="step-num-wrap" id="n3"></div>
          <div class="step-label-sm">Order</div>
          <div class="step-sub-sm" id="sub3">Waiting</div>
        </div>
      </div>

      <!-- Results -->
      <div class="results" id="results">
        <!-- Ingredients -->
        <div class="section-label"><i data-lucide="list"></i> What's in your fridge</div>
        <div class="card">
          <p class="desc" id="fridgeDesc"></p>
          <div class="chips" id="ingredientChips"></div>
        </div>

        <!-- Meals -->
        <div class="section-label"><i data-lucide="star"></i> Meal Suggestions</div>
        <div id="mealCards"></div>

        <!-- User choice -->
        <div id="choiceCard"></div>

        <!-- Top up -->
        <div id="topUpSection"></div>

        <!-- Order -->
        <div id="orderCard"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const stepIcons = { 1: 'scan-eye', 2: 'chef-hat', 3: 'truck' };

    async function checkAuth() {
      const pill = document.getElementById('authPill');
      try {
        const res = await fetch('/auth/status');
        const data = await res.json();
        pill.className = 'auth-pill' + (data.authenticated ? ' connected' : '');
        pill.innerHTML = data.authenticated
          ? '<i data-lucide="check-circle"></i> Connected <a class="logout-link" href="/auth/logout">Logout</a>'
          : '<a href="/auth/login"><i data-lucide="link"></i> Connect Swiggy</a>';
      } catch {
        pill.className = 'auth-pill';
        pill.innerHTML = '<a href="/auth/login"><i data-lucide="link"></i> Connect Swiggy</a>';
      }
      try { lucide.createIcons(); } catch {}
    }
    checkAuth();

    const fileInput = document.getElementById('fileInput');
    const uploadZone = document.getElementById('uploadZone');
    const preview = document.getElementById('preview');
    const previewImg = document.getElementById('previewImg');
    const analyseBtn = document.getElementById('analyseBtn');
    const stepsEl = document.getElementById('steps');
    const resultsEl = document.getElementById('results');

    let selectedFile = null;

    fileInput.addEventListener('change', e => {
      selectedFile = e.target.files[0];
      if (!selectedFile) return;
      const url = URL.createObjectURL(selectedFile);
      previewImg.src = url;
      preview.classList.add('show');
      uploadZone.style.display = 'none';
      analyseBtn.style.display = 'flex';
      resultsEl.classList.remove('show');
      stepsEl.classList.remove('show');
    });

    uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      uploadZone.classList.remove('drag');
      const f = e.dataTransfer.files[0];
      if (f && f.type.startsWith('image/')) {
        fileInput.files = e.dataTransfer.files;
        fileInput.dispatchEvent(new Event('change'));
      }
    });

    function resetUI() {
      selectedFile = null;
      fileInput.value = '';
      preview.classList.remove('show');
      uploadZone.style.display = '';
      analyseBtn.style.display = 'none';
      stepsEl.classList.remove('show');
      resultsEl.classList.remove('show');
      [1,2,3].forEach(i => setStep(i, '', 'Waiting'));
    }

    function setStep(n, status, msg) {
      const s = document.getElementById('s'+n);
      const num = document.getElementById('n'+n);
      const sub = document.getElementById('sub'+n);
      s.className = 'step ' + status;
      num.innerHTML = status === 'done'
        ? '<i data-lucide="circle-check"></i>'
        : `<i data-lucide="${stepIcons[n]}"></i>`;
      try { lucide.createIcons(); } catch {}
      if (msg) sub.textContent = msg;
    }

    function confClass(pct) {
      return pct >= 80 ? 'high' : pct >= 60 ? 'mid' : 'low';
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    const decisionLabels = { cook: 'Cook at home', order_dish: 'Order the dish', order_groceries: 'Order missing items' };

    async function readSSEStream(res, onEvent) {
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try { onEvent(JSON.parse(line.slice(6))); } catch {}
        }
      }
    }

    let currentMealName = null;
    let currentMissingIngredients = [];

    function isInternalReasoning(text) {
      if (!text) return true;
      const blocked = ['fallback', 'local fallback', 'enable the live model', 'temporary'];
      const lower = text.toLowerCase();
      return blocked.some(b => lower.includes(b));
    }

    function renderChoiceCard(ev) {
      const rec = ev.ai_recommendation;
      const label = decisionLabels[rec] || rec;
      const missing = (ev.missing_ingredients || []).map(escapeHtml);
      const mealName = escapeHtml(ev.recommended_meal || 'this dish');
      const rawReasoning = ev.reasoning || '';
      const showReasoning = rawReasoning && !isInternalReasoning(rawReasoning);
      const reasoning = escapeHtml(rawReasoning);

      const cookBtn = `
        <button class="choice-btn cook ${rec === 'cook' ? 'recommended' : ''}" data-action="cook" onclick="chooseAction('cook', this)">
          <div class="choice-icon-circle"><i data-lucide="flame"></i></div>
          <div class="choice-text">
            <div class="choice-btn-title">Cook at home</div>
            <div class="choice-btn-sub">Use what you already have</div>
          </div>
          ${rec === 'cook' ? '<span class="best-choice-badge">Best choice</span>' : ''}
        </button>`;

      const groceriesBtn = missing.length ? `
        <button class="choice-btn order_groceries ${rec === 'order_groceries' ? 'recommended' : ''}" data-action="order_groceries" onclick="chooseAction('order_groceries', this)">
          <div class="choice-icon-circle"><i data-lucide="shopping-cart"></i></div>
          <div class="choice-text">
            <div class="choice-btn-title">Order missing items</div>
            <div class="choice-btn-sub">${missing.join(', ')}</div>
          </div>
          ${rec === 'order_groceries' ? '<span class="best-choice-badge">Best choice</span>' : ''}
        </button>` : '';

      const dishBtn = `
        <button class="choice-btn order_dish ${rec === 'order_dish' ? 'recommended' : ''}" data-action="order_dish" onclick="chooseAction('order_dish', this)">
          <div class="choice-icon-circle"><i data-lucide="bike"></i></div>
          <div class="choice-text">
            <div class="choice-btn-title">Order the dish</div>
            <div class="choice-btn-sub">Get ${mealName} delivered</div>
          </div>
          ${rec === 'order_dish' ? '<span class="best-choice-badge">Best choice</span>' : ''}
        </button>`;

      document.getElementById('choiceCard').innerHTML =
        `<div class="card choice-card">
          <div class="choice-header-row"><span class="choice-label">Your call</span></div>
          <div class="ai-badge"><i data-lucide="sparkles"></i> AI suggests: ${escapeHtml(label)}</div>
          ${showReasoning ? `<p class="choice-subtitle">${reasoning}</p>` : ''}
          <div class="choice-buttons">
            ${cookBtn}
            ${groceriesBtn}
            ${dishBtn}
          </div>
        </div>`;
      document.getElementById('orderCard').innerHTML = '';
      try { lucide.createIcons(); } catch {}
    }

    function resetChoiceButtons() {
      document.querySelectorAll('.choice-btn').forEach(b => {
        b.disabled = false;
        b.classList.remove('loading');
        const iconEl = b.querySelector('.choice-icon-circle');
        if (iconEl && iconEl.querySelector('.spin')) {
          const action = b.dataset.action;
          const iconName = action === 'cook' ? 'flame' : action === 'order_groceries' ? 'shopping-cart' : 'bike';
          iconEl.innerHTML = `<i data-lucide="${iconName}"></i>`;
        }
      });
      try { lucide.createIcons(); } catch {}
    }

    let orderInFlight = false;

    async function chooseAction(action, btnEl) {
      if (orderInFlight) return;
      orderInFlight = true;

      document.querySelectorAll('.choice-btn').forEach(b => { b.disabled = true; });
      btnEl.classList.add('loading');
      const iconEl = btnEl.querySelector('.choice-icon-circle');
      if (iconEl) iconEl.innerHTML = '<div class="spin"></div>';

      document.getElementById('orderCard').innerHTML = '';
      setStep(3, 'active', 'Routing your order…');

      const form = new FormData();
      form.append('action', action);
      form.append('meal_name', currentMealName || '');
      form.append('missing_ingredients', currentMissingIngredients.join(','));

      try {
        const res = await fetch('/api/order', { method: 'POST', body: form });
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        await readSSEStream(res, handleEvent);
      } catch (err) {
        setStep(3, '', 'Error');
        document.getElementById('orderCard').innerHTML =
          `<div class="error-card"><i data-lucide="triangle-alert"></i><span>${escapeHtml(err.message)}</span></div>`;
        try { lucide.createIcons(); } catch {}
        resetChoiceButtons();
      } finally {
        orderInFlight = false;
      }
    }

    async function analyse() {
      if (!selectedFile) return;

      // UI state
      analyseBtn.disabled = true;
      document.getElementById('btnIcon').innerHTML = '<div class="spin"></div>';
      document.getElementById('btnText').textContent = 'Analysing…';
      stepsEl.classList.add('show');
      resultsEl.classList.remove('show');
      document.getElementById('ingredientChips').innerHTML = '';
      document.getElementById('mealCards').innerHTML = '';
      document.getElementById('choiceCard').innerHTML = '';
      document.getElementById('topUpSection').innerHTML = '';
      document.getElementById('orderCard').innerHTML = '';
      currentMealName = null;
      currentMissingIngredients = [];

      const form = new FormData();
      form.append('file', selectedFile);

      const targetDish = document.getElementById('targetDish').value.trim();
      if (targetDish) {
        form.append('target_dish', targetDish);
      }

      try {
        const res = await fetch('/api/scan', { method: 'POST', body: form });
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        await readSSEStream(res, handleEvent);
      } catch (err) {
        document.getElementById('orderCard').innerHTML =
          `<div class="error-card"><i data-lucide="triangle-alert"></i><span>${escapeHtml(err.message)}</span></div>`;
        try { lucide.createIcons(); } catch {}
        resultsEl.classList.add('show');
      } finally {
        analyseBtn.disabled = false;
        document.getElementById('btnIcon').innerHTML = '<i data-lucide="sparkles"></i>';
        document.getElementById('btnText').textContent = 'Analyse Again';
        try { lucide.createIcons(); } catch {}
      }
    }

    function handleEvent(ev) {
      if (ev.type === 'progress') {
        setStep(ev.step, 'active', ev.message);
        return;
      }

      if (ev.type === 'step1') {
        setStep(1, 'done', `${ev.ingredients.length} ingredients found`);
        document.getElementById('fridgeDesc').textContent = ev.raw_description;
        const chips = ev.ingredients.map((i, idx) =>
          `<div class="chip ${confClass(i.confidence)}" style="animation-delay:${idx * 30}ms">
            <div class="chip-dot"></div>
            ${escapeHtml(i.name)}
            <span class="chip-pct">${i.confidence}%</span>
          </div>`
        ).join('');
        document.getElementById('ingredientChips').innerHTML = chips;
        resultsEl.classList.add('show');
        try { lucide.createIcons(); } catch {}
        return;
      }

      if (ev.type === 'step2') {
        setStep(2, 'done', ev.recommended_meal ? `Recommend: ${ev.recommended_meal}` : 'Done');

        const cards = ev.suggestions.map(s => {
          const isRec = s.name === ev.recommended_meal;
          const missingList = (s.missing_ingredients || []).map(escapeHtml).join(', ');
          const missingBar = (!s.can_cook_now && missingList)
            ? `<div class="missing-bar"><i data-lucide="triangle-alert"></i><span>Missing: ${missingList}</span></div>`
            : '';
          const readyTag = s.can_cook_now
            ? '<span class="meal-tag ready"><i data-lucide="circle-check"></i> Ready to cook</span>'
            : '';
          return `<div class="meal-card">
            ${isRec ? '<div class="meal-header-bar"><i data-lucide="star"></i> Recommended</div>' : ''}
            <div class="meal-body">
              <div class="meal-name">${escapeHtml(s.name)}</div>
              <div class="meal-desc">${escapeHtml(s.description)}</div>
              ${missingBar}
              <div class="meal-tags-row">
                ${readyTag}
                <span class="meal-tag"><i data-lucide="clock"></i> ${s.prep_time_minutes}m</span>
                ${s.cuisine ? `<span class="meal-tag"><i data-lucide="globe"></i> ${escapeHtml(s.cuisine)}</span>` : ''}
              </div>
            </div>
          </div>`;
        }).join('');
        document.getElementById('mealCards').innerHTML = cards;
        try { lucide.createIcons(); } catch {}
        return;
      }

      if (ev.type === 'awaiting_user_choice') {
        currentMealName = ev.recommended_meal || '';
        currentMissingIngredients = ev.missing_ingredients || [];
        setStep(3, '', 'Waiting for your choice');
        renderChoiceCard(ev);
        resultsEl.classList.add('show');
        return;
      }

      if (ev.type === 'top_up') {
        const suggestions = ev.suggestions || [];
        if (!suggestions.length) return;

        const rows = suggestions.map((s, i) => {
          const source = s.source === 'swiggy_food' ? 'swiggy_food' : 'instamart';
          const sourceLabel = source === 'swiggy_food' ? 'Swiggy Food' : 'Instamart';
          const iconName = source === 'swiggy_food' ? 'bike' : 'shopping-cart';
          return `
            <div class="topup-row" style="animation-delay:${i * 80}ms">
              <div class="topup-icon ${source}"><i data-lucide="${iconName}"></i></div>
              <div class="topup-info">
                <div class="topup-name">${escapeHtml(s.name)}</div>
                <div class="topup-reason">${escapeHtml(s.reason)}</div>
              </div>
              <div class="topup-right">
                <div class="topup-price">₹${escapeHtml(s.estimated_price)}</div>
                <div class="topup-source ${source}">${sourceLabel}</div>
                <button class="topup-add ${source}" onclick="showToast('Coming soon — connect Swiggy to order instantly')">
                  <i data-lucide="plus-circle"></i> Add
                </button>
              </div>
            </div>`;
        }).join('');

        document.getElementById('topUpSection').innerHTML =
          `<div class="section-label topup-header-row"><i data-lucide="zap"></i> Top up your meal <span class="spacer"></span><span class="topup-powered">Powered by Instamart</span></div>
          <p class="topup-subtitle">Small additions, big upgrade</p>
          <div class="topup-card">${rows}</div>`;
        try { lucide.createIcons(); } catch {}
        return;
      }

      if (ev.type === 'cook_confirmed') {
        setStep(3, 'done', 'Ready to cook!');
        document.getElementById('orderCard').innerHTML =
          `<div class="cook-card">
            <i data-lucide="flame"></i>
            <div class="title">You're all set!</div>
            <div class="sub">All ingredients are ready in your kitchen.</div>
          </div>`;
        try { lucide.createIcons(); } catch {}
        return;
      }

      if (ev.type === 'step3') {
        const label = ev.decision === 'cook' ? 'No order needed' : `Order placed via ${ev.platform}`;
        setStep(3, 'done', label);

        if (ev.placed) {
          document.getElementById('orderCard').innerHTML =
            `<div class="order-card">
              <div class="order-icon-wrap"><i data-lucide="circle-check"></i></div>
              <div class="order-title">Order confirmed!</div>
              <div class="order-id">${escapeHtml(ev.order_id)}</div>
              <div class="order-details">
                <div class="order-row"><span class="order-label">Platform</span><span class="order-value">${escapeHtml(ev.platform)}</span></div>
                <div class="order-row"><span class="order-label">Items</span><span class="order-value">${(ev.items || []).map(escapeHtml).join(', ')}</span></div>
                <div class="order-row"><span class="order-label">ETA</span><span class="order-value eta">~${escapeHtml(ev.eta_minutes)} min</span></div>
              </div>
            </div>`;
        } else if (ev.decision === 'cook') {
          document.getElementById('orderCard').innerHTML =
            `<div class="cook-card">
              <i data-lucide="flame"></i>
              <div class="title">Time to cook!</div>
              <div class="sub">All ingredients are in your fridge.</div>
            </div>`;
        }
        try { lucide.createIcons(); } catch {}
        return;
      }

      if (ev.type === 'error') {
        [1,2,3].forEach(i => { if(document.getElementById('s'+i).classList.contains('active')) setStep(i,'','Error'); });
        document.getElementById('orderCard').innerHTML =
          `<div class="error-card"><i data-lucide="triangle-alert"></i><span>${escapeHtml(ev.message)}</span></div>`;
        resultsEl.classList.add('show');
        try { lucide.createIcons(); } catch {}
        resetChoiceButtons();
      }

      if (ev.type === 'auth_required') {
        setStep(3, '', 'Login required');
        document.getElementById('orderCard').innerHTML =
          `<div class="auth-card">
            <div class="auth-card-icon"><i data-lucide="bike"></i></div>
            <div class="auth-card-title">Connect your Swiggy account</div>
            <div class="auth-card-sub">${escapeHtml(ev.message || 'Login to place this order instantly')}</div>
            <a class="auth-cta" href="/auth/login"><i data-lucide="link"></i> Connect with Swiggy</a>
          </div>`;
        resultsEl.classList.add('show');
        try { lucide.createIcons(); } catch {}
        checkAuth();
        resetChoiceButtons();
      }
    }

    // Initial render
    [1,2,3].forEach(i => setStep(i, '', 'Waiting'));
    try { lucide.createIcons(); } catch {}
  </script>
</body>
</html>
