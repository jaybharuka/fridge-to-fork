<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>Fridge to Fork</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    /* Swiggy/Instamart-style palette: white surfaces, orange as the only
       accent color. The dark/light toggle still works (existing JS is
       untouched) but both states now render this same white look — the
       app no longer has a dark theme, per the redesign brief. */
    :root {
      --bg: #ffffff;
      --bg-1: #f8f8f8;
      --bg-2: #ffffff;
      --bg-3: #f5f5f5;
      --border: #eeeeee;
      --border-2: #e2e2e2;
      --text: #1c1c1c;
      --text-2: #6b6b6b;
      --text-3: #9b9b9b;
      --orange: #FC8019;
      --orange-dark: #E36F13;
      --orange-dim: rgba(252,128,25,0.08);
      --orange-border: rgba(252,128,25,0.3);
      /* Orange is the only accent color — green/blue are neutralized to
         plain text/near-black so nothing else reads as a second brand
         color. --red is kept solely for genuine error states. */
      --green: #1c1c1c;
      --green-deep: #1c1c1c;
      --green-dim: rgba(28,28,28,0.05);
      --green-border: rgba(28,28,28,0.14);
      --red: #E02020;
      --red-dim: rgba(224,32,32,0.06);
      --red-border: rgba(224,32,32,0.2);
      --blue: #1c1c1c;
      --blue-dim: rgba(28,28,28,0.05);
      --blue-border: rgba(28,28,28,0.14);
      --yellow: #E0A32C;
      --radius: 12px;
      --radius-sm: 10px;
      --radius-pill: 20px;
      --placeholder: #bbbbbb;
      --header-bg: rgba(255,255,255,.95);
      --hairline: rgba(0,0,0,.06);
      --hover-overlay: rgba(0,0,0,.04);
      --card-shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --hint-faint: #e2e2e2;

      /* Back-compat aliases: the component CSS/JS below this point was
         written against --swiggy-*. Pointing those names at the new
         tokens means the whole page repaints with the new design
         system without needing every rule rewritten by hand. */
      --swiggy-orange: var(--orange);
      --swiggy-orange-dark: var(--orange-dark);
      --swiggy-bg: var(--bg);
      --swiggy-surface: var(--bg-2);
      --swiggy-surface-2: var(--bg-3);
      --swiggy-border: var(--border);
      --swiggy-text: var(--text);
      --swiggy-text-2: var(--text-2);
      --swiggy-text-3: var(--text-3);
      --swiggy-green: var(--green);
      --swiggy-green-deep: var(--green-deep);
      --swiggy-blue: var(--blue);
      --swiggy-red: var(--red);
      --swiggy-yellow: var(--yellow);
      --swiggy-placeholder: var(--placeholder);
      --swiggy-header-bg: var(--header-bg);
      --swiggy-nav-bg: var(--header-bg);
      --swiggy-hairline: var(--hairline);
      --swiggy-hover-overlay: var(--hover-overlay);
      --swiggy-card-shadow: var(--card-shadow);
      --swiggy-hint-faint: var(--hint-faint);
    }

    /* The light-mode toggle class still exists functionally (JS
       unchanged) but resolves to the same white palette — there is no
       separate dark theme in this design. */
    body.light-mode {
      --bg: #ffffff;
      --bg-1: #f8f8f8;
      --bg-2: #ffffff;
      --bg-3: #f5f5f5;
      --border: #eeeeee;
      --border-2: #e2e2e2;
      --text: #1c1c1c;
      --text-2: #6b6b6b;
      --text-3: #9b9b9b;
      --orange-dim: rgba(252,128,25,0.08);
      --green-dim: rgba(28,28,28,0.05);
      --red-dim: rgba(224,32,32,0.06);
      --blue-dim: rgba(28,28,28,0.05);
      --placeholder: #bbbbbb;
      --header-bg: rgba(255,255,255,.95);
      --hairline: rgba(0,0,0,.06);
      --hover-overlay: rgba(0,0,0,.04);
      --card-shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --hint-faint: #e2e2e2;

      /* Re-declare aliases here too: a var() reference is resolved at
         its declaration point, and :root's --swiggy-* already baked in
         values before body.light-mode's overrides exist, so the
         inherited alias would stay stuck without this. */
      --swiggy-orange: var(--orange);
      --swiggy-orange-dark: var(--orange-dark);
      --swiggy-bg: var(--bg);
      --swiggy-surface: var(--bg-2);
      --swiggy-surface-2: var(--bg-3);
      --swiggy-border: var(--border);
      --swiggy-text: var(--text);
      --swiggy-text-2: var(--text-2);
      --swiggy-text-3: var(--text-3);
      --swiggy-green: var(--green);
      --swiggy-green-deep: var(--green-deep);
      --swiggy-blue: var(--blue);
      --swiggy-red: var(--red);
      --swiggy-yellow: var(--yellow);
      --swiggy-placeholder: var(--placeholder);
      --swiggy-header-bg: var(--header-bg);
      --swiggy-nav-bg: var(--header-bg);
      --swiggy-hairline: var(--hairline);
      --swiggy-hover-overlay: var(--hover-overlay);
      --swiggy-card-shadow: var(--card-shadow);
      --swiggy-hint-faint: var(--hint-faint);
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; min-width:0; }
    body {
      font-family:'Inter',sans-serif; font-size:14px; line-height:1.5; font-weight:400;
      background:var(--swiggy-bg); color:var(--swiggy-text); min-height:100vh; overflow-x:hidden;
      position:relative;
    }
    body::before {
      content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
      background:radial-gradient(ellipse 60% 40% at 50% 30%, rgba(252,128,25,.04) 0%, transparent 70%);
    }
    i[data-lucide] { display:inline-block; width:18px; height:18px; }
    svg.lucide { width:1em; height:1em; }
    i[class*="ph-"] { line-height:1; }

    /* Typography scale */
    .eyebrow { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--orange); }
    .label-text { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); }
    .caption-text { font-size:12px; color:var(--text-3); }
    .mono-text { font-family:'SF Mono','Courier New',monospace; color:var(--text); }

    .section-divider { height:1px; background:var(--border); margin:4px 20px 20px; }

    @keyframes fadeSlideUp {
      from { opacity:0; transform:translateY(12px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes pulse {
      0%,100% { opacity:1; }
      50%      { opacity:.4; }
    }

    /* Layout */
    .page { max-width:480px; margin:0 auto; min-height:100vh; position:relative; z-index:1; }
    .wrap { padding:16px 16px 32px; }

    @media (min-width:481px) {
      .page { max-width:440px; box-shadow:0 0 60px rgba(0,0,0,.5); border-left:1px solid var(--swiggy-border); border-right:1px solid var(--swiggy-border); }
    }

    /* Header */
    .app-header { position:sticky; top:0; z-index:30; height:56px; background:var(--header-bg); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
    .app-header-inner { max-width:480px; margin:0 auto; height:100%; padding:0 16px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .brand { display:flex; align-items:center; gap:8px; color:var(--text); font-weight:700; font-size:16px; white-space:nowrap; }
    .brand i { color:var(--orange); font-size:20px; }
    .header-actions { display:flex; align-items:center; gap:8px; }

    .theme-toggle {
      width:32px; height:32px; background:none; border:none; cursor:pointer; border-radius:8px;
      display:flex; align-items:center; justify-content:center; color:var(--text-3); flex-shrink:0;
    }
    .theme-toggle i { font-size:18px; }
    .theme-toggle:hover { color:var(--text); background:var(--hover-overlay); }
    .theme-toggle.active { color:var(--green); background:var(--green-dim); }

    .swiggy-pill {
      display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
      padding:6px 12px; border-radius:var(--radius-pill); white-space:nowrap; transition:.15s ease;
      border:1px solid var(--border-2); color:var(--text-3); text-decoration:none; background:transparent;
    }
    .swiggy-pill i { font-size:14px; }
    .swiggy-pill.connected { background:var(--orange-dim); border-color:var(--orange-border); color:var(--orange); }
    .swiggy-pill .logout-link { margin-left:6px; text-decoration:underline; opacity:.85; font-weight:500; color:inherit; }

    /* Hero */
    .hero { padding:24px 20px 16px; }
    .hero-title { font-size:26px; font-weight:700; color:var(--text); line-height:1.2; margin-top:8px; overflow-wrap:break-word; word-break:normal; }
    .hero-sub { font-size:14px; color:var(--text-2); line-height:1.5; margin-top:6px; overflow-wrap:break-word; word-break:normal; }

    /* Input */
    .input-section { padding:0 0 8px; }
    .input-label { display:block; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--swiggy-text-3); margin-bottom:8px; }
    .dish-input {
      width:100%; height:52px; padding:0 16px; font-size:15px; font-family:inherit; font-weight:400;
      background:var(--swiggy-surface); border:1.5px solid var(--swiggy-border); border-radius:14px;
      color:var(--swiggy-text); outline:none; transition:.15s ease;
    }
    .dish-input:focus { border-color:var(--swiggy-orange); box-shadow:0 0 0 3px rgba(252,128,25,.12); }
    .dish-input::placeholder { color:var(--swiggy-placeholder); }

    /* Servings selector */
    .servings-section { margin:14px 0 4px; }
    .servings-pills { display:flex; gap:8px; flex-wrap:wrap; }
    .servings-pill {
      min-width:40px; height:36px; padding:0 12px; border-radius:10px;
      border:1px solid var(--swiggy-border); background:transparent; color:var(--swiggy-text-2);
      font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:.15s ease;
    }
    .servings-pill:hover { border-color:var(--swiggy-orange); }
    .servings-pill.active { background:var(--swiggy-orange); border-color:var(--swiggy-orange); color:#fff; }

    /* Shared pill-style buttons, reused by the inline recipe fridge scan area */
    .pill-btn {
      display:inline-flex; align-items:center; gap:6px; border-radius:20px; padding:8px 18px;
      font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; background:transparent;
      transition:.15s ease; pointer-events:auto;
    }
    .pill-btn i { width:14px; height:14px; }
    .pill-btn-primary { border:1px solid var(--swiggy-orange); color:var(--swiggy-orange); }
    .pill-btn-primary:hover { background:rgba(252,128,25,.08); }
    .pill-btn-secondary { border:1px solid var(--swiggy-border); color:var(--swiggy-text-2); font-weight:500; }
    .pill-btn-secondary:hover { background:var(--swiggy-hover-overlay); }

    /* Get Recipe primary button */
    .analyse-btn {
      width:100%; height:52px; border-radius:var(--radius); margin-top:0;
      background:var(--bg-3); color:var(--text-3); border:none; cursor:not-allowed;
      display:flex; align-items:center; justify-content:center; gap:8px;
      font-size:16px; font-weight:700; font-family:inherit; transition:all .2s ease;
    }
    .analyse-btn i { font-size:20px; }
    .analyse-btn.ready { background:var(--orange); color:#fff; cursor:pointer; box-shadow:0 4px 20px rgba(252,128,25,.25); }
    .analyse-btn.ready:hover:not(:disabled) { background:var(--orange-dark); transform:translateY(-1px); }
    .analyse-btn.ready:active:not(:disabled) { transform:translateY(0); }
    .analyse-btn.loading { background:var(--orange); color:#fff; opacity:.85; cursor:not-allowed; }
    .analyse-btn:disabled:not(.ready):not(.loading) { cursor:not-allowed; }

    /* Secondary CTA row: Scan Fridge */
    .cta-secondary-row { display:flex; gap:8px; margin-top:8px; }
    .cta-secondary-btn {
      flex:1; height:42px; display:flex; align-items:center; justify-content:center; gap:6px;
      background:var(--bg-2); border:1px solid var(--border-2); color:var(--text-2);
      border-radius:var(--radius-sm); font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; transition:.15s ease;
    }
    .cta-secondary-btn i { font-size:16px; }
    .cta-secondary-btn:hover { border-color:var(--orange); color:var(--orange); }
    .cta-secondary-btn.active { background:var(--orange-dim); border-color:var(--orange-border); color:var(--orange); }

    /* Collapsible inline fridge photo capture on the landing screen */
    .landing-scan-area { max-height:0; overflow:hidden; transition:max-height .3s cubic-bezier(.4,0,.2,1); }
    .landing-scan-area.show { max-height:180px; }
    .landing-scan-inner { padding-top:12px; }

    /* Bottom hint */
    .bottom-hint { margin-top:12px; text-align:center; font-size:11px; color:var(--hint-faint); }
    .bottom-hint .hint-dot { margin:0 6px; }

    /* Pipeline steps — horizontal progress bar */
    .steps {
      display:none; align-items:flex-start; padding:16px 20px; background:var(--bg-1);
      border-radius:var(--radius); margin:0 20px 16px;
    }
    .steps.show { display:flex; }
    .step {
      position:relative; flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center;
      background:none; border:none; padding:0; min-height:0;
    }
    .step-connector { flex:0 0 auto; width:auto; align-self:flex-start; margin-top:11px; }
    .step-connector-line { height:1px; background:var(--border-2); width:100%; min-width:24px; transition:background .2s ease; }
    .step-connector-line.done { background:var(--green); }
    .step-num-wrap {
      width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
      border:2px solid var(--border-2); color:var(--text-3); transition:.2s ease; box-sizing:border-box;
    }
    .step-num-wrap i { width:12px; height:12px; }
    .step.active .step-num-wrap { background:var(--orange); border-color:var(--orange); color:#fff; animation:pulse 1.5s ease infinite; }
    .step.done .step-num-wrap { background:var(--green); border-color:var(--green); color:#fff; }
    .step.done .step-num-wrap i { animation:popIn .3s ease; width:14px; height:14px; }
    @keyframes popIn { 0%{transform:scale(0)} 60%{transform:scale(1.2)} 100%{transform:scale(1)} }
    .step-label-sm { font-size:10px; font-weight:700; color:var(--text-3); text-transform:uppercase; letter-spacing:.03em; margin-top:4px; }
    .step-sub-sm { font-size:11px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

    /* Section labels */
    .section-label { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--swiggy-text-2); margin:20px 0 8px; }
    .section-label i { width:14px; height:14px; color:var(--swiggy-orange); flex-shrink:0; }
    .section-label .spacer { flex:1; }

    /* Cards */
    .card { background:var(--swiggy-surface); border:1px solid var(--swiggy-border); border-radius:16px; padding:16px; overflow-wrap:break-word; word-break:normal; opacity:0; animation:fadeSlideUp .35s ease forwards; }

    /* Light mode gives real "cards" (as opposed to plain recessed
       surfaces like inputs/pills) a subtle shadow instead of relying
       only on a darker fill, matching how dark mode elevates them. */
    .card, .meal-card, .topup-card, .modal-sheet,
    .step, .recipe-checklist-card, .choice-btn {
      box-shadow: var(--swiggy-card-shadow);
    }

    /* Ingredients */
    .desc { font-size:13px; color:var(--swiggy-text-2); font-style:italic; line-height:1.6; margin-bottom:12px; overflow-wrap:break-word; word-break:normal; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border-radius:20px; font-size:12px; font-weight:600; opacity:0; animation:fadeSlideUp .3s ease forwards; }
    .chip-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .chip.high { background:rgba(252,128,25,.12); border:1px solid rgba(252,128,25,.3); color:var(--swiggy-text); }
    .chip.high .chip-dot { background:var(--swiggy-green); }
    .chip.mid { background:rgba(252,128,25,.1); border:1px solid rgba(252,128,25,.25); color:var(--swiggy-text); }
    .chip.mid .chip-dot { background:var(--swiggy-orange); }
    .chip.low { background:var(--swiggy-hover-overlay); border:1px solid var(--swiggy-border); color:var(--swiggy-text-2); }
    .chip.low .chip-dot { background:var(--swiggy-text-3); }
    .chip-pct { color:var(--swiggy-text-3); font-size:11px; }

    /* Recipe checklist card — the hero result card */
    .recipe-checklist-card {
      padding:0; margin:0 20px 8px; border-radius:18px; overflow:hidden;
      background:var(--bg-2); border:1px solid var(--border);
    }
    .recipe-dish-header { background:var(--bg-3); border-bottom:1px solid var(--border); padding:14px 16px; display:flex; align-items:center; gap:12px; }
    .recipe-dish-icon {
      width:40px; height:40px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
      background:var(--orange-dim); border:1px solid var(--orange-border); color:var(--orange); font-size:20px;
    }
    .recipe-dish-info { flex:1; min-width:0; }
    .recipe-dish-name { font-size:17px; font-weight:700; color:var(--text); overflow-wrap:break-word; word-break:normal; }
    .recipe-dish-meta { font-size:12px; color:var(--text-3); margin-top:2px; }
    .recipe-ai-badge {
      flex-shrink:0; background:var(--orange-dim); border:1px solid var(--orange-border); color:var(--orange);
      font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:3px 8px; border-radius:var(--radius-pill);
    }

    .recipe-stats-row { display:flex; border-bottom:1px solid var(--border); }
    .recipe-stat { flex:1; padding:12px; text-align:center; border-right:1px solid var(--border); }
    .recipe-stat:last-child { border-right:none; }
    .recipe-stat-number { font-size:20px; font-weight:700; }
    .recipe-stat-number.have { color:var(--green); }
    .recipe-stat-label { font-size:10px; font-weight:600; color:var(--text-3); text-transform:uppercase; letter-spacing:.04em; margin-top:2px; }

    .recipe-checklist-sub { font-size:12px; color:var(--text-3); padding:10px 16px 0; }
    .recipe-rows { display:flex; flex-direction:column; gap:3px; padding:8px 12px; }
    .recipe-row {
      display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius-sm); cursor:pointer;
      border:1px solid var(--border); background:var(--bg-1); transition:all .12s ease;
    }
    .recipe-row-checkbox {
      width:18px; height:18px; border-radius:5px; flex-shrink:0; border:1.5px solid var(--border-2);
      display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; transition:all .12s ease;
    }
    .recipe-row-info { flex:1; min-width:0; }
    .recipe-row-name { font-size:13px; font-weight:500; color:var(--text); overflow-wrap:break-word; word-break:normal; }
    .recipe-row-qty { font-size:11px; color:var(--text-3); margin-top:2px; overflow-wrap:break-word; word-break:normal; }

    .recipe-row.checked { opacity:.6; }
    .recipe-row.checked .recipe-row-checkbox { background:var(--green); border-color:var(--green); }
    .recipe-row.checked .recipe-row-name,
    .recipe-row.checked .recipe-row-qty { text-decoration:line-through; }

    .recipe-row-right { flex-shrink:0; display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
    .recipe-row-tag {
      flex-shrink:0; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
      color:var(--text-3); background:var(--bg-2); border:1px solid var(--border-2);
      padding:3px 8px; border-radius:var(--radius-pill); white-space:nowrap;
    }

    .recipe-checklist-footer { padding:4px 12px 12px; }
    .recipe-order-count { font-size:12px; color:var(--text-2); margin-bottom:10px; text-align:center; }
    .recipe-cart-btn {
      width:100%; height:48px; border-radius:var(--radius-sm); border:none; background:var(--orange); color:#fff;
      font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .recipe-cart-btn:hover { background:var(--orange-dark); }
    .recipe-cart-btn i { font-size:18px; }

    .recipe-steps-block { border-top:1px solid var(--border); }
    .recipe-steps-toggle {
      display:flex; align-items:center; gap:8px; width:100%;
      background:none; border:none; color:var(--text); font-size:13px; font-weight:700;
      cursor:pointer; font-family:inherit; padding:12px 16px;
    }
    .recipe-steps-toggle i:first-child { font-size:16px; color:var(--orange); }
    .recipe-steps-toggle i:last-child { font-size:14px; color:var(--text-3); }
    .recipe-steps-list { list-style:none; padding:0 16px 14px; display:flex; flex-direction:column; gap:10px; }
    .recipe-steps-list li { display:flex; gap:10px; font-size:13px; line-height:1.5; color:var(--text-2); }
    .recipe-step-num {
      flex-shrink:0; width:20px; height:20px; border-radius:50%; background:var(--orange-dim);
      border:1px solid var(--orange-border); color:var(--orange); font-size:11px; font-weight:700;
      display:flex; align-items:center; justify-content:center;
    }
    .recipe-scan-area { padding:0 16px 14px; }
    .recipe-scan-actions { display:flex; gap:10px; justify-content:center; padding-top:12px; }
    .recipe-scan-status {
      display:flex; align-items:center; justify-content:center; gap:6px; margin-top:12px;
      font-size:12px; color:var(--text-2); text-align:center;
    }
    .recipe-scan-status i { font-size:14px; color:var(--green); }

    /* Meal cards */
    #mealCards { display:flex; flex-direction:column; gap:10px; }
    .meal-card { background:var(--swiggy-surface); border:1px solid var(--swiggy-border); border-radius:16px; overflow:hidden; opacity:0; animation:fadeSlideUp .35s ease forwards; }
    .meal-header-bar { background:var(--swiggy-orange); color:#fff; height:36px; display:flex; align-items:center; gap:6px; padding:0 14px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
    .meal-header-bar i { width:14px; height:14px; }
    .meal-body { padding:14px; }
    .meal-name { font-size:17px; font-weight:700; color:var(--swiggy-text); overflow-wrap:break-word; word-break:normal; }
    .meal-desc {
      font-size:12px; color:var(--swiggy-text-2); margin:4px 0; line-height:1.5;
      display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
      overflow-wrap:break-word; word-break:normal; white-space:normal;
    }
    .missing-bar {
      display:flex; align-items:flex-start; gap:6px; background:rgba(252,128,25,.1); border:1px solid rgba(252,128,25,.25);
      border-radius:8px; padding:8px 10px; font-size:12px; color:var(--swiggy-orange); margin:8px 0;
      white-space:normal; word-wrap:break-word; overflow:hidden; overflow-wrap:break-word;
    }
    .missing-bar i { width:14px; height:14px; flex-shrink:0; margin-top:1px; }
    .meal-tags-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
    .meal-tag { display:inline-flex; align-items:center; gap:4px; background:var(--swiggy-surface-2); color:var(--swiggy-text-3); font-size:10px; border-radius:20px; padding:4px 10px; }
    .meal-tag i { width:11px; height:11px; }
    .meal-tag.ready { color:var(--swiggy-green); }
    .meal-tag.ready i { color:var(--swiggy-green); }

    /* Choice card */
    .choice-header-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .choice-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--swiggy-text-3); }
    .choice-subtitle { font-size:12px; color:var(--swiggy-text-2); font-style:italic; line-height:1.5; margin:10px 0 12px; overflow-wrap:break-word; word-break:normal; }
    .choice-buttons { display:flex; flex-direction:column; gap:8px; }
    /* Both choice buttons are solid full-width orange CTAs, stacked,
       styled identically — no color-coding one over the other. */
    .choice-btn {
      display:flex; align-items:center; gap:12px; width:100%; text-align:left;
      background:var(--orange); border:none; border-radius:var(--radius); padding:16px;
      cursor:pointer; font-family:inherit; color:#fff; transition:all .15s ease; overflow:visible;
      box-shadow:0 2px 8px rgba(252,128,25,.3);
    }
    .choice-btn:hover:not(:disabled) { background:var(--orange-dark); }
    .choice-btn:disabled:not(.loading) { opacity:.4; cursor:not-allowed; }
    .choice-btn.loading { opacity:.7; cursor:not-allowed; }
    .choice-icon-circle { width:40px; height:40px; min-width:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:rgba(255,255,255,.2); color:#fff; }
    .choice-text { flex:1; min-width:0; }
    .choice-btn-title { font-size:14px; font-weight:700; color:#fff; overflow-wrap:break-word; word-break:normal; }
    .choice-btn-sub { font-size:12px; color:rgba(255,255,255,.85); margin-top:2px; white-space:normal; word-wrap:break-word; overflow-wrap:break-word; word-break:normal; }
    .choice-meta { flex-shrink:0; white-space:nowrap; font-size:13px; font-weight:700; text-align:right; color:#fff; }

    /* Top up */
    .topup-header-row { margin:20px 0 4px; }
    .topup-header-row .spacer { flex:1; }
    .topup-powered { font-size:10px; color:var(--swiggy-text-3); text-transform:none; letter-spacing:0; font-weight:500; }
    .topup-subtitle { font-size:12px; color:var(--swiggy-text-2); margin-bottom:10px; }
    /* Instamart-style product cards: image placeholder, name, price,
       orange Add button — scroll horizontally as a row. */
    .topup-scroll { display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
    .topup-product-card {
      flex:0 0 132px; background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius);
      box-shadow:var(--card-shadow); padding:10px; opacity:0; animation:fadeSlideUp .4s ease forwards;
    }
    .topup-img-placeholder {
      width:100%; aspect-ratio:1; border-radius:var(--radius-sm); background:var(--bg-1);
      display:flex; align-items:center; justify-content:center; font-size:32px; margin-bottom:8px;
    }
    .topup-name { font-size:12px; font-weight:600; color:var(--text); overflow-wrap:break-word; word-break:normal; }
    .topup-reason {
      font-size:10px; color:var(--text-3); margin-top:2px; overflow:hidden; display:-webkit-box;
      -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical;
    }
    .topup-add-btn {
      display:flex; align-items:center; justify-content:center; gap:3px; width:100%; padding:6px 10px;
      border-radius:var(--radius-pill); margin-top:8px;
      font-size:11px; font-weight:700; background:var(--orange); color:#fff; border:none;
      cursor:pointer; font-family:inherit; white-space:nowrap;
    }
    .topup-add-btn:hover { background:var(--orange-dark); }
    .topup-add-btn i { font-size:12px; }
    .topup-add-btn.added { background:var(--text-3); cursor:default; }

    /* Secondary/cancel button, reused by the Top Up and order-preview sheets */
    .modal-cancel-btn {
      width:100%; height:48px; border-radius:14px; background:transparent; color:var(--swiggy-text-2);
      border:1px solid var(--swiggy-border); font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; margin-top:8px;
    }

    /* Auth required card */
    .auth-card { background:rgba(252,128,25,.06); border:1px solid rgba(252,128,25,.2); border-radius:16px; padding:20px; text-align:center; }
    .auth-card-icon { width:56px; height:56px; border-radius:50%; background:rgba(252,128,25,.15); color:var(--swiggy-orange); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
    .auth-card-icon i { font-size:28px; }
    .auth-card-title { font-weight:700; font-size:15px; color:var(--swiggy-text); }
    .auth-card-sub { font-size:12px; color:var(--swiggy-text-2); margin-top:6px; margin-bottom:16px; overflow-wrap:break-word; word-break:normal; }
    .auth-cta { width:100%; height:48px; border-radius:14px; background:var(--swiggy-orange); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; font-size:14px; border:none; cursor:pointer; transition:.15s ease; }
    .auth-cta:hover { background:var(--swiggy-orange-dark); }
    .auth-cta i { font-size:16px; }

    /* Order confirmed card */
    .order-card { background:rgba(252,128,25,.06); border:1px solid rgba(252,128,25,.3); border-radius:16px; padding:20px; }
    .order-icon-wrap { text-align:center; margin-bottom:8px; }
    .order-icon-wrap i { font-size:24px; color:var(--swiggy-green); display:inline-flex; align-items:center; justify-content:center; width:48px; height:48px; border-radius:50%; background:rgba(252,128,25,.2); }
    .order-title { text-align:center; color:var(--swiggy-green); font-size:18px; font-weight:700; }
    .order-id { text-align:center; font-family:'Courier New',monospace; color:var(--swiggy-text-2); font-size:12px; margin-top:4px; overflow-wrap:break-word; word-break:break-all; }
    .order-details { margin-top:14px; }
    .order-row { display:flex; justify-content:space-between; gap:8px; font-size:13px; padding:6px 0; border-top:1px solid var(--swiggy-hairline); flex-wrap:wrap; }
    .order-row:first-child { border-top:none; }
    .order-label { color:var(--swiggy-text-3); flex-shrink:0; }
    .order-value { color:var(--swiggy-text); text-align:right; min-width:0; overflow-wrap:break-word; word-break:normal; }
    .order-value.eta { color:var(--swiggy-orange); font-weight:700; }

    /* Cook confirmed card */
    .cook-card { background:rgba(252,128,25,.06); border:1px solid rgba(252,128,25,.3); border-radius:16px; padding:20px; text-align:center; }
    .cook-card i { font-size:24px; color:var(--swiggy-green); margin-bottom:8px; display:inline-block; }
    .cook-card .title { color:var(--swiggy-green); font-weight:700; font-size:16px; }
    .cook-card .sub { color:var(--swiggy-text-2); font-size:12px; margin-top:4px; }

    /* Error card */
    .error-card { background:rgba(231,76,60,.1); border:1px solid rgba(231,76,60,.3); border-radius:16px; padding:16px; font-size:13px; color:var(--swiggy-red); overflow-wrap:break-word; word-break:normal; display:flex; align-items:flex-start; gap:8px; }
    .error-card i { width:16px; height:16px; flex-shrink:0; margin-top:1px; }

    /* Results */
    .results { display:none; }
    .results.show { display:block; }

    /* Spinner */
    .spin { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; flex-shrink:0; }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* Toast */
    .toast {
      position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
      background:var(--swiggy-surface-2); border:1px solid var(--swiggy-border); color:var(--swiggy-text);
      padding:12px 18px; border-radius:12px; font-size:13px; z-index:60; opacity:0;
      transition:.3s ease; pointer-events:none; max-width:90%; text-align:center;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }


    .shopping-list-item { display:flex; justify-content:space-between; font-size:12px; color:var(--swiggy-text-2); padding:6px 0; border-bottom:1px solid var(--swiggy-hairline); }
    .shopping-list-item:last-child { border-bottom:none; }

    .order-launched-card {
      background:rgba(252,128,25,.08); border:1px solid rgba(252,128,25,.3); border-radius:16px; padding:16px; margin-top:14px; text-align:center;
    }
    .order-launched-card i { width:28px; height:28px; color:var(--swiggy-green); margin-bottom:6px; }
    .order-launched-card .title { font-weight:700; font-size:14px; color:var(--swiggy-green); }
    .order-launched-card .sub { font-size:12px; color:var(--swiggy-text-2); margin-top:4px; }

    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:55; display:flex; align-items:flex-end; justify-content:center; }
    @media (min-width:481px) { .modal-overlay { align-items:center; } }
    .modal-sheet { width:100%; max-width:480px; background:var(--swiggy-surface); border-radius:20px 20px 0 0; padding:20px; max-height:85vh; overflow-y:auto; }
    @media (min-width:481px) { .modal-sheet { border-radius:20px; } }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .modal-header h3 { font-size:16px; font-weight:700; }
    .modal-close { background:none; border:none; color:var(--swiggy-text-2); cursor:pointer; }
    .modal-close i { width:20px; height:20px; }
    .field { margin-bottom:12px; }
    .field label { display:block; font-size:11px; font-weight:600; color:var(--swiggy-text-3); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
    .field input, .field select {
      width:100%; height:44px; padding:0 12px; background:var(--swiggy-surface-2); border:1px solid var(--swiggy-border);
      border-radius:10px; color:var(--swiggy-text); font-size:14px; font-family:inherit; outline:none;
    }
    .field input:focus, .field select:focus { border-color:var(--swiggy-orange); }
    .field-row { display:flex; gap:10px; }
    .field-row .field { flex:1; }
    .modal-submit {
      width:100%; height:48px; border-radius:14px; background:var(--swiggy-orange); color:#fff; border:none;
      font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:6px;
    }
    .empty-state { text-align:center; padding:40px 16px; color:var(--swiggy-text-3); font-size:13px; }

    /* ── Smart Cart modal ─────────────────────────────────────────── */
    .cart-header { margin-bottom: 16px; }
    .cart-title { color: var(--swiggy-text); font-size: 17px; font-weight: 700;
        font-family: Inter, sans-serif; margin-bottom: 4px; }
    .cart-subtitle { color: var(--swiggy-text-2); font-size: 13px;
        font-family: Inter, sans-serif; }

    .cart-items-list { display: flex; flex-direction: column;
        gap: 2px; margin-bottom: 16px; }
    .cart-item-row { display: flex; align-items: center; gap: 12px;
        padding: 10px 12px; background: var(--swiggy-surface-2); border-radius: 12px;
        margin-bottom: 6px; box-shadow: var(--swiggy-card-shadow); }
    .cart-item-icon { width: 36px; height: 36px; border-radius: 50%;
        background: rgba(252,128,25,0.15); display: flex;
        align-items: center; justify-content: center;
        font-size: 16px; flex-shrink: 0; }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name { color: var(--swiggy-text); font-size: 13px; font-weight: 600;
        font-family: Inter, sans-serif; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis; }
    .cart-item-qty { color: var(--swiggy-text-3); font-size: 11px;
        font-family: Inter, sans-serif; margin-top: 2px; }
    .cart-item-price { color: var(--swiggy-text-2); font-size: 12px;
        font-weight: 600; font-family: Inter, sans-serif;
        flex-shrink: 0; }

    .cart-item-status { font-size: 11px; margin-top: 2px;
        font-family: Inter, sans-serif; }
    .cart-item-status.searching { color: var(--swiggy-orange); }
    .cart-item-status.added { color: var(--swiggy-green); }
    .cart-item-status.failed { color: var(--swiggy-red); }
    .cart-item-status-icon { flex-shrink: 0; }

    .cart-summary { background: var(--swiggy-surface-2); border-radius: 12px;
        padding: 12px 14px; margin-bottom: 14px; box-shadow: var(--swiggy-card-shadow); }
    .cart-summary-row { display: flex; justify-content: space-between;
        color: var(--swiggy-text-2); font-size: 13px;
        font-family: Inter, sans-serif; }

    .cart-connect-btn { width: 100%; padding: 15px;
        background: var(--swiggy-orange); color: #fff; border: none;
        border-radius: 14px; font-size: 15px; font-weight: 700;
        font-family: Inter, sans-serif; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        gap: 8px; margin-bottom: 10px; }
    .cart-connect-hint { text-align: center; color: var(--swiggy-text-3);
        font-size: 11px; font-family: Inter, sans-serif;
        margin-bottom: 12px; line-height: 1.4; }
    .cart-manual-link { display: block; text-align: center;
        color: var(--swiggy-text-2); font-size: 12px;
        font-family: Inter, sans-serif;
        text-decoration: underline; cursor: pointer; }

    .cart-progress-footer { margin-top: 16px; }
    .cart-complete { display: flex; align-items: center; gap: 8px;
        color: var(--swiggy-green); font-size: 14px; font-weight: 600;
        font-family: Inter, sans-serif; margin-bottom: 12px; }
    .cart-checkout-btn { width: 100%; padding: 15px;
        background: var(--swiggy-orange); color: #fff; border: none;
        border-radius: 14px; font-size: 15px; font-weight: 700;
        font-family: Inter, sans-serif; cursor: pointer; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="app-header">
      <div class="app-header-inner">
        <div class="brand"><i class="ph ph-fork-knife"></i><span>Fridge to Fork</span></div>
        <div class="header-actions">
          <button type="button" class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle light and dark mode">
            <i class="ph ph-moon" id="themeToggleIcon"></i>
          </button>
          <div id="authPill"></div>
        </div>
      </div>
    </header>

    <!-- ═══════════════ COOK TAB ═══════════════ -->
    <div id="cookTab">
      <div class="hero">
        <div class="eyebrow">AI Kitchen Assistant</div>
        <h1 class="hero-title">What do you want to eat?</h1>
        <p class="hero-sub">Type a dish. We'll find what's missing and get it delivered.</p>
      </div>

      <div class="wrap">
        <!-- Target Dish Input -->
        <div class="input-section">
          <label class="input-label" for="targetDish">I want to eat...</label>
          <input type="text" id="targetDish" class="dish-input" placeholder="e.g. Biryani, Pasta, Dal Makhani..." />
        </div>

        <!-- Servings selector -->
        <div class="servings-section">
          <label class="input-label">For how many people?</label>
          <div class="servings-pills" id="servingsPills">
            <button type="button" class="servings-pill" data-servings="1" onclick="setServings(1)">1</button>
            <button type="button" class="servings-pill active" data-servings="2" onclick="setServings(2)">2</button>
            <button type="button" class="servings-pill" data-servings="3" onclick="setServings(3)">3</button>
            <button type="button" class="servings-pill" data-servings="4" onclick="setServings(4)">4</button>
            <button type="button" class="servings-pill" data-servings="5" onclick="setServings(5)">5</button>
            <button type="button" class="servings-pill" data-servings="6" onclick="setServings(6)">6</button>
            <button type="button" class="servings-pill" data-servings="8" onclick="setServings(8)">8</button>
            <button type="button" class="servings-pill" data-servings="10" onclick="setServings(10)">10</button>
          </div>
        </div>

        <!-- Get Recipe -->
        <button class="analyse-btn ready" id="analyseBtn" onclick="startScan('recipe')">
          <span id="btnIcon"><i class="ph ph-sparkle"></i></span>
          <span id="btnText">Get Recipe</span>
        </button>

        <div class="cta-secondary-row">
          <button type="button" class="cta-secondary-btn" id="scanFridgeBtn" onclick="toggleLandingScanArea()">
            <i class="ph ph-camera"></i> Scan Fridge
          </button>
        </div>

        <!-- Collapsible fridge photo capture, hidden until "Scan Fridge" is tapped -->
        <div class="landing-scan-area" id="landingScanArea">
          <div class="landing-scan-inner">
            <input type="file" id="landingScanFileInput" accept="image/*" capture="environment" style="display:none;" />
            <div class="recipe-scan-actions">
              <button type="button" class="pill-btn pill-btn-primary" onclick="triggerLandingScanCamera()"><i class="ph ph-camera"></i> Take Photo</button>
              <button type="button" class="pill-btn pill-btn-secondary" onclick="triggerLandingScanGallery()"><i class="ph ph-image"></i> Choose Photo</button>
            </div>
            <div id="landingScanStatus" class="recipe-scan-status"></div>
          </div>
        </div>

        <p class="bottom-hint">Powered by Gemini Vision <span class="hint-dot">·</span> Swiggy MCP</p>

        <div class="section-divider"></div>

        <!-- Progress steps -->
        <div class="steps" id="steps">
          <div class="step" id="s1">
            <div class="step-num-wrap" id="n1"></div>
            <div class="step-label-sm">Vision</div>
            <div class="step-sub-sm" id="sub1">Waiting</div>
          </div>
          <div class="step-connector"><div class="step-connector-line" id="connector1"></div></div>
          <div class="step" id="s2">
            <div class="step-num-wrap" id="n2"></div>
            <div class="step-label-sm">Planner</div>
            <div class="step-sub-sm" id="sub2">Waiting</div>
          </div>
          <div class="step-connector"><div class="step-connector-line" id="connector2"></div></div>
          <div class="step" id="s3">
            <div class="step-num-wrap" id="n3"></div>
            <div class="step-label-sm">Order</div>
            <div class="step-sub-sm" id="sub3">Waiting</div>
          </div>
        </div>

        <!-- Results -->
        <div class="results" id="results">
          <!-- Ingredients (hidden when there's no fridge scan to show, e.g. recipe mode) -->
          <div id="fridgeIngredientsSection" style="display:none;">
            <div class="section-label"><i data-lucide="list"></i> What's in your fridge</div>
            <div class="card">
              <p class="desc" id="fridgeDesc"></p>
              <div class="chips" id="ingredientChips"></div>
            </div>
          </div>

          <!-- Recipe checklist (only if the plan returned recipe_ingredients) -->
          <div id="recipeChecklistSection"></div>

          <!-- Meals: only shown when there are genuinely multiple options to
               compare (e.g. scanning the fridge without naming a dish). A
               single target-dish result would just duplicate the recipe
               checklist card below it. -->
          <div id="mealSuggestionsSection" style="display:none;">
            <div class="section-label"><i data-lucide="star"></i> Meal Suggestions</div>
            <div id="mealCards"></div>
          </div>

          <!-- User choice -->
          <div id="choiceCard"></div>

          <!-- Top up -->
          <div id="topUpSection"></div>

          <!-- Order -->
          <div id="orderCard"></div>
        </div>
      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>
  <div id="orderPreviewModalContainer"></div>

  <div id="smartCartModal" style="display:none;position:fixed;
       inset:0;z-index:2000;background:rgba(0,0,0,0.7);
       backdrop-filter:blur(8px);align-items:flex-end;
       justify-content:center;" onclick="closeCartModal()">
      <div style="width:100%;max-width:480px;background:var(--swiggy-surface);
           border-radius:24px 24px 0 0;max-height:85vh;
           display:flex;flex-direction:column;
           box-shadow:0 -8px 40px rgba(0,0,0,0.4);"
           onclick="event.stopPropagation()">
          <div style="padding:16px 20px;border-bottom:
               1px solid var(--swiggy-border);display:flex;
               align-items:center;justify-content:space-between;
               flex-shrink:0;">
              <div style="display:flex;align-items:center;gap:8px;">
                  <i data-lucide="shopping-cart"
                     style="color:var(--swiggy-orange);width:18px;
                     height:18px;"></i>
                  <span style="color:var(--swiggy-text);font-weight:700;
                        font-size:16px;font-family:Inter,sans-serif;">
                      Instamart Cart
                  </span>
              </div>
              <button onclick="closeCartModal()"
                      style="background:var(--swiggy-surface-2);border:none;
                      color:var(--swiggy-text-2);border-radius:8px;
                      width:32px;height:32px;cursor:pointer;
                      font-size:16px;">&times;</button>
          </div>
          <div id="cartModalBody" style="overflow-y:auto;
               flex:1;padding:16px 20px 32px;">
          </div>
      </div>
  </div>

  <script>
    /* ═══════════════ THEME TOGGLE ═══════════════ */
    function applyTheme(isLight) {
      document.body.classList.toggle('light-mode', isLight);
      const icon = document.getElementById('themeToggleIcon');
      if (icon) {
        icon.className = isLight ? 'ph ph-sun' : 'ph ph-moon';
      }
    }

    function toggleTheme() {
      const isLight = !document.body.classList.contains('light-mode');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      applyTheme(isLight);
    }

    applyTheme(localStorage.getItem('theme') === 'light');

    const stepIcons = { 1: 'scan-eye', 2: 'chef-hat', 3: 'truck' };

    async function checkAuth() {
      const pill = document.getElementById('authPill');
      try {
        const res = await fetch('/auth/status');
        const data = await res.json();
        pill.innerHTML = data.authenticated
          ? '<a class="swiggy-pill connected" href="/auth/logout" title="Click to log out"><i class="ph ph-check-circle"></i> Connected</a>'
          : '<a class="swiggy-pill" href="/auth/login"><i class="ph ph-link"></i> Connect Swiggy</a>';
      } catch {
        pill.innerHTML = '<a class="swiggy-pill" href="/auth/login"><i class="ph ph-link"></i> Connect Swiggy</a>';
      }
      try { lucide.createIcons(); } catch {}
    }
    checkAuth();

    /* ═══════════════ COOK TAB — SCAN FLOW ═══════════════ */
    const analyseBtn = document.getElementById('analyseBtn');
    const stepsEl = document.getElementById('steps');
    const resultsEl = document.getElementById('results');

    let servings = 2;

    function setServings(n) {
      servings = n;
      document.querySelectorAll('.servings-pill').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.servings, 10) === n);
      });
    }

    function setAnalyseReady(text) {
      analyseBtn.disabled = false;
      analyseBtn.classList.remove('loading');
      analyseBtn.classList.add('ready');
      document.getElementById('btnIcon').innerHTML = '<i class="ph ph-sparkle"></i>';
      document.getElementById('btnText').textContent = text || 'Get Recipe';
      try { lucide.createIcons(); } catch {}
    }

    function setAnalyseLoading() {
      analyseBtn.disabled = true;
      analyseBtn.classList.remove('ready');
      analyseBtn.classList.add('loading');
      document.getElementById('btnIcon').innerHTML = '<div class="spin"></div>';
      document.getElementById('btnText').textContent = 'Getting recipe...';
    }

    function setStep(n, status, msg) {
      const s = document.getElementById('s'+n);
      const num = document.getElementById('n'+n);
      const sub = document.getElementById('sub'+n);
      s.className = 'step ' + status;
      num.innerHTML = status === 'done'
        ? '<i class="ph ph-check"></i>'
        : `<i data-lucide="${stepIcons[n]}"></i>`;
      const connector = document.getElementById('connector'+n);
      if (connector) connector.classList.toggle('done', status === 'done');
      try { lucide.createIcons(); } catch {}
      if (msg) sub.textContent = msg;
    }

    function confClass(pct) {
      return pct >= 80 ? 'high' : pct >= 60 ? 'mid' : 'low';
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    async function readSSEStream(res, onEvent) {
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try { onEvent(JSON.parse(line.slice(6))); } catch {}
        }
      }
    }

    let currentMealName = null;
    let currentMissingIngredients = [];
    let currentTopUpSuggestions = [];
    let currentFridgeIngredients = [];
    let currentRecipeChecklist = [];
    let currentRecipeDishName = '';
    let currentRecipeServings = 2;
    let currentRecipeMeta = { prepTime: 0, cuisine: '' };
    let currentRecipeSteps = [];
    let recipeStepsExpanded = false;

    /* ═══════════════ RECIPE CART CHECKLIST ═══════════════ */
    // The checkbox means "I already have this" — checked items are
    // excluded from the order. Pantry staples and anything fuzzy-matched
    // against a scanned fridge photo are pre-checked; everything else
    // starts unchecked (needs to be ordered) until the user says
    // otherwise. Toggling any row is a plain override in either
    // direction.

    function renderRecipeChecklist(ev) {
      const section = document.getElementById('recipeChecklistSection');
      if (!section) return;
      const recipeIngredients = ev.recipe_ingredients || [];
      if (!recipeIngredients.length) {
        section.innerHTML = '';
        currentRecipeChecklist = [];
        return;
      }

      currentRecipeDishName = ev.recommended_meal || (ev.suggestions[0] && ev.suggestions[0].name) || 'this dish';
      currentRecipeServings = servings;
      const recSuggestion = (ev.suggestions || []).find(s => s.name === currentRecipeDishName) || (ev.suggestions || [])[0] || {};
      currentRecipeMeta = { prepTime: recSuggestion.prep_time_minutes || 0, cuisine: recSuggestion.cuisine || '' };
      currentRecipeSteps = ev.cooking_steps || [];
      currentRecipeChecklist = recipeIngredients.map(ing => {
        const foundInFridge = ing.found_in_fridge === true;
        const isStaple = ing.is_staple === true;
        return {
          name: ing.name,
          quantity: ing.quantity,
          estimated_price_inr: ing.estimated_price_inr || 0,
          foundInFridge,
          isStaple,
          checked: foundInFridge || isStaple,
        };
      });
      renderRecipeChecklistCard();
    }

    // Builds the card shell ONCE per new recipe. Row toggles and the
    // inline fridge scan only touch #recipeRowsContainer /
    // #recipeChecklistFooter / #recipeStatsRow afterwards, so the scan
    // area's own open/closed state and any in-progress upload survive
    // re-renders.
    function renderRecipeChecklistCard() {
      const section = document.getElementById('recipeChecklistSection');
      if (!section) return;
      if (!currentRecipeChecklist.length) { section.innerHTML = ''; return; }

      const metaParts = [`For ${currentRecipeServings} people`];
      if (currentRecipeMeta.prepTime) metaParts.push(`${currentRecipeMeta.prepTime} min`);
      if (currentRecipeMeta.cuisine) metaParts.push(currentRecipeMeta.cuisine);

      section.innerHTML = `
        <div class="recipe-checklist-card">
          <div class="recipe-dish-header">
            <div class="recipe-dish-icon"><i class="ph ph-cooking-pot"></i></div>
            <div class="recipe-dish-info">
              <div class="recipe-dish-name">${escapeHtml(currentRecipeDishName)}</div>
              <div class="recipe-dish-meta">${escapeHtml(metaParts.join(' · '))}</div>
            </div>
            <div class="recipe-ai-badge">AI</div>
          </div>
          <div class="recipe-stats-row" id="recipeStatsRow">${buildRecipeStatsHtml()}</div>
          <p class="recipe-checklist-sub">Select the items you need to order</p>
          <div class="recipe-rows" id="recipeRowsContainer">${buildRecipeRowsHtml()}</div>
          <div id="recipeChecklistFooter">${buildRecipeFooterHtml()}</div>
          ${buildRecipeStepsHtml()}
        </div>`;

      try { lucide.createIcons(); } catch {}
    }

    function buildRecipeStepsHtml() {
      if (!currentRecipeSteps.length) return '';
      const stepsList = currentRecipeSteps.map((step, i) =>
        `<li><span class="recipe-step-num">${i + 1}</span><span>${escapeHtml(step)}</span></li>`
      ).join('');
      return `
        <div class="recipe-steps-block">
          <button type="button" class="recipe-steps-toggle" onclick="toggleRecipeSteps()">
            <i class="ph ph-book-open"></i> How to make it
            <i class="ph ${recipeStepsExpanded ? 'ph-caret-up' : 'ph-caret-down'}" style="margin-left:auto;"></i>
          </button>
          <ol class="recipe-steps-list" id="recipeStepsList" style="display:${recipeStepsExpanded ? '' : 'none'};">
            ${stepsList}
          </ol>
        </div>`;
    }

    function toggleRecipeSteps() {
      recipeStepsExpanded = !recipeStepsExpanded;
      const list = document.getElementById('recipeStepsList');
      const toggleBtn = document.querySelector('.recipe-steps-toggle i:last-child');
      if (list) list.style.display = recipeStepsExpanded ? '' : 'none';
      if (toggleBtn) toggleBtn.className = recipeStepsExpanded ? 'ph ph-caret-up' : 'ph ph-caret-down';
    }

    function buildRecipeStatsHtml() {
      const haveCount = currentRecipeChecklist.filter(i => i.checked).length;
      const toOrderCount = currentRecipeChecklist.filter(i => !i.checked).length;
      return `
        <div class="recipe-stat">
          <div class="recipe-stat-number have">${haveCount}</div>
          <div class="recipe-stat-label">You have</div>
        </div>
        <div class="recipe-stat">
          <div class="recipe-stat-number" style="color:var(--orange)">${toOrderCount}</div>
          <div class="recipe-stat-label">To order</div>
        </div>`;
    }

    function buildRecipeRowsHtml() {
      return currentRecipeChecklist.map((ing, idx) => {
        // Checked = "I have this" (staple, fridge-matched, or manually
        // confirmed) — greyed out + strikethrough. Auto-detected ones
        // (not manually toggled on by the user) get an explanatory tag.
        let tag = '';
        if (ing.checked) {
          if (ing.foundInFridge) tag = '<span class="recipe-row-tag">📷 in fridge</span>';
          else if (ing.isStaple) tag = '<span class="recipe-row-tag">Staple</span>';
        }
        return `
          <div class="recipe-row ${ing.checked ? 'checked' : ''}" onclick="toggleRecipeItem(${idx})">
            <span class="recipe-row-checkbox">${ing.checked ? '<i class="ph ph-check"></i>' : ''}</span>
            <div class="recipe-row-info">
              <div class="recipe-row-name">${escapeHtml(ing.name)}</div>
              <div class="recipe-row-qty">${escapeHtml(ing.quantity)}</div>
            </div>
            <div class="recipe-row-right">
              ${tag}
            </div>
          </div>`;
      }).join('');
    }

    function buildRecipeFooterHtml() {
      const toOrderCount = currentRecipeChecklist.filter(i => !i.checked).length;
      if (toOrderCount === 0) return '';
      return `
        <div class="recipe-checklist-footer">
          <p class="recipe-order-count">${toOrderCount} ingredient${toOrderCount === 1 ? '' : 's'} to order</p>
          <button class="recipe-cart-btn" onclick="orderRecipeCart()">
            <i class="ph ph-shopping-cart"></i> Add ${toOrderCount} item${toOrderCount === 1 ? '' : 's'} to Instamart
          </button>
        </div>`;
    }

    function updateRecipeRowsAndFooter() {
      const rowsEl = document.getElementById('recipeRowsContainer');
      const footerEl = document.getElementById('recipeChecklistFooter');
      const statsEl = document.getElementById('recipeStatsRow');
      if (rowsEl) rowsEl.innerHTML = buildRecipeRowsHtml();
      if (footerEl) footerEl.innerHTML = buildRecipeFooterHtml();
      if (statsEl) statsEl.innerHTML = buildRecipeStatsHtml();
      try { lucide.createIcons(); } catch {}
    }

    function toggleRecipeItem(idx) {
      const item = currentRecipeChecklist[idx];
      if (!item) return;
      item.checked = !item.checked;
      updateRecipeRowsAndFooter();
    }

    function parseQuantityString(qtyStr) {
      const match = (qtyStr || '').match(/^([\d.]+)\s*(.*)$/);
      if (match) {
        return { qty_needed: parseFloat(match[1]) || 1, unit: match[2].trim() || 'unit' };
      }
      return { qty_needed: 1, unit: qtyStr || 'unit' };
    }

    function orderRecipeCart() {
      const toOrderItems = currentRecipeChecklist.filter(i => !i.checked);
      if (!toOrderItems.length) return;
      const cartItems = toOrderItems.map((ing, idx) => {
        const { qty_needed, unit } = parseQuantityString(ing.quantity);
        return {
          id: `recipe_${idx}_${Date.now()}`,
          name: ing.name,
          qty_needed,
          unit,
          threshold: qty_needed,
          category: 'food',
        };
      });
      openSmartCart(cartItems);
    }

    function addTopUpToCart(idx) {
      const item = currentTopUpSuggestions[idx];
      if (!item) return;
      openSmartCart([{
        id: `topup_${idx}_${Date.now()}`,
        name: item.name,
        qty_needed: 1,
        unit: 'piece',
        threshold: 1,
        category: 'food',
      }]);
    }

    function isInternalReasoning(text) {
      if (!text) return true;
      const blocked = ['fallback', 'local fallback', 'enable the live model', 'temporary'];
      const lower = text.toLowerCase();
      return blocked.some(b => lower.includes(b));
    }

    function renderChoiceCard(ev) {
      const missing = (ev.missing_ingredients || []).map(escapeHtml);
      const missingText = missing.length ? missing.join(', ') : 'Nothing — you have everything';
      const mealName = escapeHtml(ev.recommended_meal || 'this dish');
      const rawReasoning = ev.reasoning || '';
      const showReasoning = rawReasoning && !isInternalReasoning(rawReasoning);
      const reasoning = escapeHtml(rawReasoning);

      // Both options are shown as equal choices — no AI recommendation
      // or "best choice" badge steering the user toward either one.
      const groceriesBtn = `
        <button class="choice-btn order_groceries" data-action="order_groceries" onclick="confirmOrderGroceries(this)">
          <div class="choice-icon-circle"><i class="ph ph-shopping-cart"></i></div>
          <div class="choice-text">
            <div class="choice-btn-title">Order missing items from Instamart</div>
            <div class="choice-btn-sub">${missingText}</div>
          </div>
        </button>`;

      const dishBtn = `
        <button class="choice-btn order_dish" data-action="order_dish" onclick="chooseAction('order_dish', this)">
          <div class="choice-icon-circle"><i class="ph ph-motorcycle"></i></div>
          <div class="choice-text">
            <div class="choice-btn-title">Order the dish from Swiggy</div>
            <div class="choice-btn-sub">Get ${mealName} delivered</div>
          </div>
          <div class="choice-meta">30 min</div>
        </button>`;

      document.getElementById('choiceCard').innerHTML =
        `<div class="card choice-card">
          <div class="choice-header-row"><span class="choice-label">What do you want to do?</span></div>
          ${showReasoning ? `<p class="choice-subtitle">${reasoning}</p>` : ''}
          <div class="choice-buttons">
            ${groceriesBtn}
            ${dishBtn}
          </div>
        </div>`;
      document.getElementById('orderCard').innerHTML = '';
      try { lucide.createIcons(); } catch {}
    }

    function resetChoiceButtons() {
      document.querySelectorAll('.choice-btn').forEach(b => {
        b.disabled = false;
        b.classList.remove('loading');
        const iconEl = b.querySelector('.choice-icon-circle');
        if (iconEl && iconEl.querySelector('.spin')) {
          const action = b.dataset.action;
          const iconName = action === 'order_groceries' ? 'ph-shopping-cart' : 'ph-motorcycle';
          iconEl.innerHTML = `<i class="ph ${iconName}"></i>`;
        }
      });
      try { lucide.createIcons(); } catch {}
    }

    let orderInFlight = false;

    async function chooseAction(action, btnEl) {
      if (orderInFlight) return;
      orderInFlight = true;

      document.querySelectorAll('.choice-btn').forEach(b => { b.disabled = true; });
      btnEl.classList.add('loading');
      const iconEl = btnEl.querySelector('.choice-icon-circle');
      if (iconEl) iconEl.innerHTML = '<div class="spin"></div>';

      document.getElementById('orderCard').innerHTML = '';
      setStep(3, 'active', 'Routing your order…');

      const form = new FormData();
      form.append('action', action);
      form.append('meal_name', currentMealName || '');
      form.append('missing_ingredients', currentMissingIngredients.join(','));

      try {
        const res = await fetch('/api/order', { method: 'POST', body: form });
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        await readSSEStream(res, handleEvent);
      } catch (err) {
        setStep(3, '', 'Error');
        document.getElementById('orderCard').innerHTML =
          `<div class="error-card"><i data-lucide="triangle-alert"></i><span>${escapeHtml(err.message)}</span></div>`;
        try { lucide.createIcons(); } catch {}
        resetChoiceButtons();
      } finally {
        orderInFlight = false;
      }
    }

    /* ═══════════════ ORDER MISSING ITEMS — PREVIEW MODAL ═══════════════ */
    let pendingGroceriesBtn = null;

    function getMissingIngredientDefaults(name) {
      const lower = name.toLowerCase();
      const rules = [
        { words: ['dal', 'rice', 'atta', 'flour', 'sugar', 'salt', 'oil', 'ghee', 'masala', 'powder'], unit: 'kg', qty: 0.5 },
        { words: ['milk', 'juice', 'water', 'lassi'], unit: 'L', qty: 1 },
        { words: ['leaves', 'coriander', 'methi', 'curry'], unit: 'bunch', qty: 1 },
        { words: ['egg'], unit: 'piece', qty: 6 },
      ];
      for (const rule of rules) {
        if (rule.words.some(w => lower.includes(w))) {
          return { unit: rule.unit, qty: rule.qty };
        }
      }
      // Fallback: no dailyUse to base a real estimate on, so use a
      // single sensible pack rather than a fractional "1.4 piece".
      return { unit: 'pack', qty: 1 };
    }

    function confirmOrderGroceries(btnEl) {
      const items = currentMissingIngredients;
      if (!items.length) {
        chooseAction('order_groceries', btnEl);
        return;
      }
      pendingGroceriesBtn = btnEl;

      const rows = items.map(name => {
        const { unit, qty } = getMissingIngredientDefaults(name);
        return `<div class="shopping-list-item"><span>${escapeHtml(name)}</span><span>${qty} ${escapeHtml(unit)}</span></div>`;
      }).join('');

      document.getElementById('orderPreviewModalContainer').innerHTML = `
        <div class="modal-overlay" onclick="closeOrderPreviewModal(event)">
          <div class="modal-sheet" onclick="event.stopPropagation()">
            <div class="modal-header">
              <h3>Order missing items</h3>
              <button class="modal-close" onclick="closeOrderPreviewModal()"><i data-lucide="x"></i></button>
            </div>
            <div class="cart-items-list">${rows}</div>
            <button class="modal-submit" onclick="confirmAndOrderGroceries()">Confirm and Order</button>
            <button class="modal-cancel-btn" onclick="closeOrderPreviewModal()">Cancel</button>
          </div>
        </div>`;
      try { lucide.createIcons(); } catch {}
    }

    function closeOrderPreviewModal(e) {
      if (e) e.stopPropagation();
      document.getElementById('orderPreviewModalContainer').innerHTML = '';
    }

    async function confirmAndOrderGroceries() {
      const btnEl = pendingGroceriesBtn;
      closeOrderPreviewModal();
      chooseAction('order_groceries', btnEl);
    }

    async function startScan(mode, file) {
      // UI state
      setAnalyseLoading();
      stepsEl.classList.add('show');
      resultsEl.classList.remove('show');
      document.getElementById('ingredientChips').innerHTML = '';
      document.getElementById('mealCards').innerHTML = '';
      document.getElementById('mealSuggestionsSection').style.display = 'none';
      document.getElementById('recipeChecklistSection').innerHTML = '';
      document.getElementById('choiceCard').innerHTML = '';
      document.getElementById('topUpSection').innerHTML = '';
      document.getElementById('orderCard').innerHTML = '';
      currentMealName = null;
      currentMissingIngredients = [];
      currentFridgeIngredients = [];
      currentRecipeChecklist = [];

      const form = new FormData();
      if (mode === 'photo' && file) {
        // No `mode` field: the backend's original vision branch runs
        // whenever mode isn't "recipe".
        form.append('file', file);
      } else {
        form.append('mode', mode);
      }

      const targetDish = document.getElementById('targetDish').value.trim();
      if (targetDish) {
        form.append('target_dish', targetDish);
      }
      form.append('servings', servings);

      try {
        const res = await fetch('/api/scan', { method: 'POST', body: form });
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        await readSSEStream(res, handleEvent);
      } catch (err) {
        document.getElementById('orderCard').innerHTML =
          `<div class="error-card"><i data-lucide="triangle-alert"></i><span>${escapeHtml(err.message)}</span></div>`;
        try { lucide.createIcons(); } catch {}
        resultsEl.classList.add('show');
      } finally {
        setAnalyseReady('Get Recipe');
      }
    }

    /* ── Landing "Scan Fridge" secondary button ── */
    function toggleLandingScanArea() {
      const area = document.getElementById('landingScanArea');
      const btn = document.getElementById('scanFridgeBtn');
      const showing = area.classList.contains('show');
      area.classList.toggle('show', !showing);
      if (btn) btn.classList.toggle('active', !showing);
    }

    function triggerLandingScanCamera() {
      const input = document.getElementById('landingScanFileInput');
      input.setAttribute('capture', 'environment');
      input.click();
    }

    function triggerLandingScanGallery() {
      const input = document.getElementById('landingScanFileInput');
      input.removeAttribute('capture');
      input.click();
    }

    document.getElementById('landingScanFileInput').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const statusEl = document.getElementById('landingScanStatus');
      statusEl.innerHTML = '<div class="spin"></div> Scanning your fridge…';
      startScan('photo', file);
    });

    function handleEvent(ev) {
      if (ev.type === 'progress') {
        setStep(ev.step, 'active', ev.message);
        return;
      }

      if (ev.type === 'step1') {
        const hasIngredients = (ev.ingredients || []).length > 0;
        setStep(1, 'done', hasIngredients ? `${ev.ingredients.length} ingredients found` : 'No fridge scan');
        currentFridgeIngredients = ev.ingredients || [];
        document.getElementById('fridgeIngredientsSection').style.display = hasIngredients ? '' : 'none';
        document.getElementById('fridgeDesc').textContent = ev.raw_description;
        const chips = ev.ingredients
          .filter(i => i.name && i.name.trim() !== '')
          .map((i, idx) =>
          `<div class="chip ${confClass(i.confidence)}" style="animation-delay:${idx * 30}ms">
            <div class="chip-dot"></div>
            ${escapeHtml(i.name)}
            <span class="chip-pct">${i.confidence}%</span>
          </div>`
        ).join('');
        document.getElementById('ingredientChips').innerHTML = chips;
        resultsEl.classList.add('show');
        try { lucide.createIcons(); } catch {}
        return;
      }

      if (ev.type === 'step2') {
        setStep(2, 'done', ev.recommended_meal ? `Recommend: ${ev.recommended_meal}` : 'Done');

        const cards = ev.suggestions.map(s => {
          const isRec = s.name === ev.recommended_meal;
          return `<div class="meal-card">
            ${isRec ? '<div class="meal-header-bar"><i data-lucide="star"></i> Recommended</div>' : ''}
            <div class="meal-body">
              <div class="meal-name">${escapeHtml(s.name)}</div>
              <div class="meal-desc">${escapeHtml(s.description)}</div>
              <div class="meal-tags-row">
                <span class="meal-tag"><i data-lucide="clock"></i> ${s.prep_time_minutes}m</span>
                ${s.cuisine ? `<span class="meal-tag"><i data-lucide="globe"></i> ${escapeHtml(s.cuisine)}</span>` : ''}
              </div>
            </div>
          </div>`;
        }).join('');
        document.getElementById('mealCards').innerHTML = cards;
        document.getElementById('mealSuggestionsSection').style.display =
          ev.suggestions.length > 1 ? '' : 'none';
        renderRecipeChecklist(ev);
        try { lucide.createIcons(); } catch {}
        return;
      }

      if (ev.type === 'awaiting_user_choice') {
        currentMealName = ev.recommended_meal || '';
        currentMissingIngredients = ev.missing_ingredients || [];
        setStep(3, '', 'Waiting for your choice');
        renderChoiceCard(ev);
        resultsEl.classList.add('show');
        return;
      }

      if (ev.type === 'top_up') {
        const suggestions = ev.suggestions || [];
        if (!suggestions.length) return;
        currentTopUpSuggestions = suggestions;

        const cards = suggestions.map((s, i) => `
            <div class="topup-product-card" style="animation-delay:${i * 80}ms">
              <div class="topup-img-placeholder">${escapeHtml(s.emoji || '🛒')}</div>
              <div class="topup-name">${escapeHtml(s.name)}</div>
              <div class="topup-reason">${escapeHtml(s.reason)}</div>
              <button class="topup-add-btn" id="topupAddBtn-${i}" onclick="addTopUpToCart(${i})">
                <i class="ph ph-plus"></i> Add
              </button>
            </div>`
        ).join('');

        document.getElementById('topUpSection').innerHTML =
          `<div class="section-label topup-header-row"><i class="ph ph-lightning"></i> Top up your meal <span class="spacer"></span><span class="topup-powered">Powered by Instamart</span></div>
          <p class="topup-subtitle">Small additions, big upgrade</p>
          <div class="topup-scroll">${cards}</div>`;
        try { lucide.createIcons(); } catch {}
        return;
      }

      if (ev.type === 'cook_confirmed') {
        setStep(3, 'done', 'Ready to cook!');
        document.getElementById('orderCard').innerHTML =
          `<div class="cook-card">
            <i class="ph ph-cooking-pot"></i>
            <div class="title">You're all set!</div>
            <div class="sub">All ingredients are ready in your kitchen.</div>
          </div>`;
        try { lucide.createIcons(); } catch {}
        return;
      }

      if (ev.type === 'step3') {
        const label = ev.decision === 'cook' ? 'No order needed' : `Order placed via ${ev.platform}`;
        setStep(3, 'done', label);

        if (ev.placed) {
          document.getElementById('orderCard').innerHTML =
            `<div class="order-card">
              <div class="order-icon-wrap"><i class="ph ph-check-fat"></i></div>
              <div class="order-title">Order confirmed!</div>
              <div class="order-id">${escapeHtml(ev.order_id)}</div>
              <div class="order-details">
                <div class="order-row"><span class="order-label">Platform</span><span class="order-value">${escapeHtml(ev.platform)}</span></div>
                <div class="order-row"><span class="order-label">Items</span><span class="order-value">${(ev.items || []).map(escapeHtml).join(', ')}</span></div>
                <div class="order-row"><span class="order-label">ETA</span><span class="order-value eta">~${escapeHtml(ev.eta_minutes)} min</span></div>
              </div>
            </div>`;
        } else if (ev.decision === 'cook') {
          document.getElementById('orderCard').innerHTML =
            `<div class="cook-card">
              <i class="ph ph-cooking-pot"></i>
              <div class="title">Time to cook!</div>
              <div class="sub">All ingredients are in your fridge.</div>
            </div>`;
        }
        try { lucide.createIcons(); } catch {}
        return;
      }

      if (ev.type === 'error') {
        [1,2,3].forEach(i => { if(document.getElementById('s'+i).classList.contains('active')) setStep(i,'','Error'); });
        document.getElementById('orderCard').innerHTML =
          `<div class="error-card"><i data-lucide="triangle-alert"></i><span>${escapeHtml(ev.message)}</span></div>`;
        resultsEl.classList.add('show');
        try { lucide.createIcons(); } catch {}
        resetChoiceButtons();
      }

      if (ev.type === 'auth_required') {
        setStep(3, '', 'Login required');
        document.getElementById('orderCard').innerHTML =
          `<div class="auth-card">
            <div class="auth-card-icon"><i class="ph ph-motorcycle"></i></div>
            <div class="auth-card-title">Connect your Swiggy account</div>
            <div class="auth-card-sub">${escapeHtml(ev.message || 'Login to place this order instantly')}</div>
            <a class="auth-cta" href="/auth/login"><i class="ph ph-link"></i> Connect with Swiggy</a>
          </div>`;
        resultsEl.classList.add('show');
        try { lucide.createIcons(); } catch {}
        checkAuth();
        resetChoiceButtons();
      }
    }

    /* ═══════════════ SMART CART ═══════════════ */
    async function openSmartCart(customItems) {
      if (!customItems || !customItems.length) return;

      // Check auth status
      const authRes = await fetch('/auth/status');
      const authData = await authRes.json();

      showCartModal(customItems, authData.authenticated);
    }

    function showCartModal(items, isAuthenticated) {
      window._cartItems = items;
      window._cartAuthenticated = isAuthenticated;

      const modal = document.getElementById('smartCartModal');
      modal.style.display = 'flex';
      renderCartModalContent(items, isAuthenticated);
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function renderCartModalContent(items, isAuthenticated) {
      const body = document.getElementById('cartModalBody');

      if (!isAuthenticated) {
        // State A — show preview + connect button
        body.innerHTML = `
            <div class="cart-header">
                <div class="cart-title">Your Instamart Cart</div>
                <div class="cart-subtitle">
                    Connect Swiggy to add these items automatically
                </div>
            </div>
            <div class="cart-items-list">
                ${items.map(item => `
                    <div class="cart-item-row">
                        <div class="cart-item-icon ${item.category}">
                            ${getCategoryEmoji(item.category)}
                        </div>
                        <div class="cart-item-info">
                            <div class="cart-item-name">
                                ${escapeHtml(item.name)}
                            </div>
                            <div class="cart-item-qty">
                                Need: ${item.qty_needed.toFixed(1)}
                                ${escapeHtml(item.unit)}
                            </div>
                        </div>
                        <div class="cart-item-price">~₹--</div>
                    </div>
                `).join('')}
            </div>
            <div class="cart-summary">
                <div class="cart-summary-row">
                    <span>${items.length} items ready to add</span>
                    <span>Est. 15-30 min</span>
                </div>
            </div>
            <button class="cart-connect-btn"
                    onclick="window.location.href='/auth/login'">
                <i data-lucide="link"></i>
                Connect Swiggy to order
            </button>
            <div class="cart-connect-hint">
                After connecting, we'll add all items to your
                Instamart cart automatically
            </div>
            <a class="cart-manual-link"
               onclick="openInstamartManually()">
                Open Instamart manually →
            </a>
        `;
      } else {
        // State B — start cart fill agent
        body.innerHTML = `
            <div class="cart-header">
                <div class="cart-title">Adding to Instamart Cart</div>
                <div class="cart-subtitle">
                    Please wait while we add your items...
                </div>
            </div>
            <div class="cart-items-list" id="cartItemsProgress">
                ${items.map(item => `
                    <div class="cart-item-row"
                         id="cart-item-${escapeHtml(item.id)}">
                        <div class="cart-item-icon ${item.category}">
                            ${getCategoryEmoji(item.category)}
                        </div>
                        <div class="cart-item-info">
                            <div class="cart-item-name">
                                ${escapeHtml(item.name)}
                            </div>
                            <div class="cart-item-status searching">
                                Waiting...
                            </div>
                        </div>
                        <div class="cart-item-status-icon">
                            <i data-lucide="clock"
                               style="color:var(--swiggy-text-3);width:16px;
                               height:16px;"></i>
                        </div>
                    </div>
                `).join('')}
            </div>
            <div id="cartProgressFooter" class="cart-progress-footer">
                Processing...
            </div>
        `;
        if (typeof lucide !== 'undefined') lucide.createIcons();
        startCartFill(items);
      }
    }

    async function startCartFill(items) {
      const response = await fetch('/api/cart-fill', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({items})
      });

      const reader = response.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const {done, value} = await reader.read();
        if (done) break;

        const text = decoder.decode(value);
        const lines = text.split('\n');

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const event = JSON.parse(line.slice(6));
            handleCartEvent(event, items);
          } catch(e) {}
        }
      }
    }

    function handleCartEvent(event, items) {
      const row = document.getElementById(
        `cart-item-${event.itemId}`
      );

      if (event.type === 'item_searching' && row) {
        row.querySelector('.cart-item-status').textContent =
          'Searching...';
        row.querySelector('.cart-item-status').className =
          'cart-item-status searching';
      }

      if (event.type === 'item_added' && row) {
        row.querySelector('.cart-item-status').textContent =
          'Added to cart';
        row.querySelector('.cart-item-status').className =
          'cart-item-status added';
        row.querySelector('.cart-item-status-icon').innerHTML =
          '<i data-lucide="circle-check" style="color:var(--swiggy-green);' +
          'width:16px;height:16px;"></i>';
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }

      if (event.type === 'item_failed' && row) {
        row.querySelector('.cart-item-status').textContent =
          'Not found';
        row.querySelector('.cart-item-status').className =
          'cart-item-status failed';
        row.querySelector('.cart-item-status-icon').innerHTML =
          '<i data-lucide="x-circle" style="color:var(--swiggy-red);' +
          'width:16px;height:16px;"></i>';
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }

      if (event.type === 'auth_required') {
        renderCartModalContent(items, false);
        return;
      }

      if (event.type === 'cart_complete') {
        const added = document.querySelectorAll(
          '.cart-item-status.added'
        ).length;
        const footer = document.getElementById('cartProgressFooter');
        if (footer) {
          footer.innerHTML = `
                <div class="cart-complete">
                    <i data-lucide="circle-check"
                       style="color:var(--swiggy-green);width:20px;
                       height:20px;"></i>
                    <span>Cart ready — ${added} items added</span>
                </div>
                <button class="cart-checkout-btn"
                    onclick="window.open(
                        'https://www.swiggy.com/instamart','_blank'
                    )">
                    Open Instamart to checkout →
                </button>
            `;
          if (typeof lucide !== 'undefined') lucide.createIcons();
        }
      }
    }

    async function openInstamartManually() {
      const items = window._cartItems || [];
      const listText = items.map((item, i) =>
        `${i+1}. ${item.name}`
      ).join('\n');
      try {
        await navigator.clipboard.writeText(listText);
      } catch(e) {}
      const firstName = items[0]?.name || '';
      window.open(
        `https://www.swiggy.com/instamart/search?query=` +
        encodeURIComponent(firstName),
        '_blank'
      );
      closeCartModal();
    }

    function closeCartModal() {
      document.getElementById('smartCartModal').style.display = 'none';
    }

    function getCategoryEmoji(category) {
      const map = {
        food: '🥗', bathroom: '🚿',
        cosmetics: '✨', household: '🏠'
      };
      return map[category] || '📦';
    }

    // Initial render
    setAnalyseReady('Get Recipe');
    [1,2,3].forEach(i => setStep(i, '', 'Waiting'));
    try { lucide.createIcons(); } catch {}
  </script>
</body>
