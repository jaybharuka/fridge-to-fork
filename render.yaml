services:
  - type: web
    name: fridge-to-fork
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_SUGGESTIONS_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: SWIGGY_CLIENT_ID
        sync: false
      - key: DELIVERY_ADDRESS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
