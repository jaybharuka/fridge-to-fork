[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fridge-to-fork"
version = "0.1.0"
description = "AI agent that looks at your fridge and decides what to cook or order"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "boto3>=1.34.0",
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.1.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
]

[project.scripts]
fridge-to-fork = "fridge_to_fork.agent:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
